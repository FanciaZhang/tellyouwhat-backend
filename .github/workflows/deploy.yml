name: Backend Deployment Runtime

on:
  workflow_call:
    inputs:
      acceptance:
        required: true
        type: string
      strategy:
        type: string
        default: blue-green
      source_run:
        required: true
        type: string
      confirmation:
        type: string
        default: ''

permissions:
  contents: read
  packages: read

env:
  IMAGE_PREFIX: ghcr.io/fanciazhang/tellyouwhat-ai

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    concurrency:
      group: backend-production
      cancel-in-progress: false
    steps:
      - name: Validate release selection
        env:
          ACCEPTANCE: ${{ inputs.acceptance }}
          STRATEGY: ${{ inputs.strategy }}
          SOURCE_RUN: ${{ inputs.source_run }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          [[ "$ACCEPTANCE" == internal || "$ACCEPTANCE" == public ]]
          case "$STRATEGY" in
            blue-green) test -z "$CONFIRMATION" ;;
            disruptive) test "$CONFIRMATION" = "interrupt:$GITHUB_SHA" ;;
            *) exit 2 ;;
          esac
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Materialize protected deployment inputs
        env:
          PRODUCTION_ENV_FILE: ${{ secrets.PRODUCTION_ENV_FILE }}
          HEALTH_SUBSCRIPTION_KEY: ${{ secrets.HEALTH_APP_STORE_PRIVATE_KEY }}
          JOURNAL_SUBSCRIPTION_KEY: ${{ secrets.JOURNAL_APP_STORE_PRIVATE_KEY }}
          HEALTH_MARKETING_KEY: ${{ secrets.HEALTH_APP_STORE_CONNECT_PRIVATE_KEY }}
          JOURNAL_MARKETING_KEY: ${{ secrets.JOURNAL_APP_STORE_CONNECT_PRIVATE_KEY }}
          PLATFORM_OPERATIONS_WRITES_ENABLED: ${{ vars.PLATFORM_OPERATIONS_WRITES_ENABLED }}
          ARK_SERVICE_CREDENTIALS: ${{ secrets.ARK_MANAGEMENT_CREDENTIALS_JSON }}
        run: |
          install -d -m 700 "$RUNNER_TEMP/tellyouwhat-secrets"
          printf '%s\n' "$PRODUCTION_ENV_FILE" > "$RUNNER_TEMP/.env.production"
          printf '%s\n' "$HEALTH_SUBSCRIPTION_KEY" > "$RUNNER_TEMP/tellyouwhat-secrets/health-subscription.p8"
          printf '%s\n' "$JOURNAL_SUBSCRIPTION_KEY" > "$RUNNER_TEMP/tellyouwhat-secrets/journal-subscription.p8"
          printf '%s\n' "$HEALTH_MARKETING_KEY" > "$RUNNER_TEMP/tellyouwhat-secrets/health-marketing.p8"
          printf '%s\n' "$JOURNAL_MARKETING_KEY" > "$RUNNER_TEMP/tellyouwhat-secrets/journal-marketing.p8"
          chmod 600 "$RUNNER_TEMP/.env.production" "$RUNNER_TEMP"/tellyouwhat-secrets/*.p8
          grep -q '^HEALTH_API_DOMAIN=' "$RUNNER_TEMP/.env.production"
          grep -q '^JOURNAL_API_DOMAIN=' "$RUNNER_TEMP/.env.production"
          grep -q '^ADMIN_DOMAIN=' "$RUNNER_TEMP/.env.production"
          for key in "$RUNNER_TEMP"/tellyouwhat-secrets/*.p8; do openssl pkey -in "$key" -noout; done
          python3 deploy/tencent/platform_configuration.py "$RUNNER_TEMP/.env.production"
          python3 deploy/tencent/ark_credentials.py materialize --output "$RUNNER_TEMP/ark-management.json"
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/tellyouwhat-production
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/tellyouwhat-production
      - name: Upload deployment files
        env:
          DEPLOY_HOST: ${{ vars.PRODUCTION_HOST }}
          DEPLOY_USER: ${{ vars.PRODUCTION_USER }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          remote_stage="/opt/tellyouwhat/backend/.incoming-${GITHUB_SHA}"
          ssh -i ~/.ssh/tellyouwhat-production -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" "install -d -m 700 '$remote_stage/secrets' '$remote_stage/deploy/single-server' '$remote_stage/deploy/tencent'"
          scp -i ~/.ssh/tellyouwhat-production -o IdentitiesOnly=yes compose.production.yaml compose.ark-management.yaml "$DEPLOY_USER@$DEPLOY_HOST:$remote_stage/"
          scp -i ~/.ssh/tellyouwhat-production -o IdentitiesOnly=yes deploy/single-server/Caddyfile deploy/single-server/Caddyfile.external "$DEPLOY_USER@$DEPLOY_HOST:$remote_stage/deploy/single-server/"
          scp -i ~/.ssh/tellyouwhat-production -o IdentitiesOnly=yes deploy/tencent/deploy-production.sh deploy/tencent/readiness.sh deploy/tencent/install-operations.sh deploy/tencent/release.py deploy/tencent/blue_green.py deploy/tencent/disruptive_release.py deploy/tencent/operations.py deploy/tencent/ark_credentials.py deploy/tencent/ops_*.py "$DEPLOY_USER@$DEPLOY_HOST:$remote_stage/deploy/tencent/"
          scp -i ~/.ssh/tellyouwhat-production -o IdentitiesOnly=yes "$RUNNER_TEMP/.env.production" "$DEPLOY_USER@$DEPLOY_HOST:$remote_stage/.env.production"
          scp -i ~/.ssh/tellyouwhat-production -o IdentitiesOnly=yes "$RUNNER_TEMP"/tellyouwhat-secrets/*.p8 "$DEPLOY_USER@$DEPLOY_HOST:$remote_stage/secrets/"
          if test -f "$RUNNER_TEMP/ark-management.json"; then
            scp -i ~/.ssh/tellyouwhat-production -o IdentitiesOnly=yes "$RUNNER_TEMP/ark-management.json" "$DEPLOY_USER@$DEPLOY_HOST:$remote_stage/ark-management.json"
          fi
          ssh -i ~/.ssh/tellyouwhat-production -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- "$remote_stage" <<'REMOTE'
          set -euo pipefail
          stage="$1"
          backend_dir=/opt/tellyouwhat/backend
          install -d -m 750 "$backend_dir/secrets"
          chmod 600 "$stage/.env.production"
          chmod 750 "$stage/secrets"
          chmod 640 "$stage/secrets/"*.p8
          chmod 755 "$stage/deploy/tencent/"*.sh
          sudo -n chgrp 65532 "$backend_dir/secrets" "$stage/secrets" "$stage/secrets/"*.p8
          sudo -n chmod 2750 "$backend_dir/secrets"
          python3 "$stage/deploy/tencent/ark_credentials.py" install --stage "$stage" --backend-dir "$backend_dir"
          REMOTE
      - name: Back up database before migration
        env:
          DEPLOY_HOST: ${{ vars.PRODUCTION_HOST }}
          DEPLOY_USER: ${{ vars.PRODUCTION_USER }}
        run: |
          ssh -i ~/.ssh/tellyouwhat-production -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" python3 "/opt/tellyouwhat/backend/.incoming-${GITHUB_SHA}/deploy/tencent/operations.py" backup
      - name: Deploy and verify internal services
        env:
          DEPLOY_HOST: ${{ vars.PRODUCTION_HOST }}
          DEPLOY_USER: ${{ vars.PRODUCTION_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOYMENT_MODE: ${{ inputs.acceptance }}
          RELEASE_STRATEGY: ${{ inputs.strategy }}
          SOURCE_RUN: ${{ inputs.source_run }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/tellyouwhat-production -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          remote_stage="/opt/tellyouwhat/backend/.incoming-${GITHUB_SHA}"
          set +e
          ssh -i ~/.ssh/tellyouwhat-production -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" python3 "$remote_stage/deploy/tencent/release.py" deploy --tag "$GITHUB_SHA" --registry "$IMAGE_PREFIX" --acceptance "$DEPLOYMENT_MODE" --bundle "$remote_stage" --strategy "$RELEASE_STRATEGY" --source-run "$SOURCE_RUN" --confirm-interruption "${CONFIRMATION:-none}"
          status=$?
          set -e
          if [ "$status" -eq 75 ]; then
            echo '::error::Blue-green capacity is insufficient. Current services remain active. Separate interruption confirmation is required.'
            {
              echo '### Manual interruption requires confirmation'
              echo 'CPU/RAM capacity refused blue-green deployment. No automatic interruption will run.'
              echo 'Do you want to interrupt active requests, AI streams, voice sessions and tasks to deploy this version?'
              echo 'Only after accepting downtime, manually open [Backend Disruptive Deployment](https://github.com/${{ github.repository }}/actions/workflows/disruptive-deploy.yml).'
              printf 'Source run: `%s`; expected SHA: `%s`; confirmation: `interrupt:%s`; acceptance: `%s`. Offer expires in 24 hours and is invalidated by an active-version/configuration change.\n' "$SOURCE_RUN" "$GITHUB_SHA" "$GITHUB_SHA" "$DEPLOYMENT_MODE"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          printf 'Internal services verified for `%s`. Requested stage: `%s`.\n' "$GITHUB_SHA" "$DEPLOYMENT_MODE" >> "$GITHUB_STEP_SUMMARY"
      - name: Enable scheduled operations
        env:
          DEPLOY_HOST: ${{ vars.PRODUCTION_HOST }}
          DEPLOY_USER: ${{ vars.PRODUCTION_USER }}
        run: |
          ssh -i ~/.ssh/tellyouwhat-production -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" bash /opt/tellyouwhat/backend/deploy/tencent/install-operations.sh

