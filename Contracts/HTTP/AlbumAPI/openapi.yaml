openapi: 3.0.3
info:
  title: Album Account and Upload API
  version: 0.1.0
  description: Account-owned durable upload staging. originals_verified does not mean previews or local replacement are ready.
security:
  - AlbumAccount: []
paths:
  /v1/albums/auth/challenges:
    post:
      operationId: createAlbumLoginChallenge
      security: []
      responses:
        '201':
          description: Single-use Apple login challenge; nonce is already hashed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LoginChallenge'}
        default: {$ref: '#/components/responses/Error'}
  /v1/albums/auth/apple:
    post:
      operationId: loginAlbumWithApple
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challengeID, proof, authorizationCode, identityToken]
              properties:
                challengeID: {type: string, format: uuid}
                proof: {type: string, minLength: 43, maxLength: 43}
                authorizationCode: {type: string, minLength: 1, maxLength: 4096}
                identityToken: {type: string, minLength: 1, maxLength: 65536}
      responses:
        '200':
          description: Account session; store token in Keychain
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AlbumSession'}
        default: {$ref: '#/components/responses/Error'}
  /v1/albums/auth/logout:
    post:
      operationId: logoutAlbumSession
      responses:
        '204': {description: Current session revoked}
        default: {$ref: '#/components/responses/Error'}
  /v1/albums/account:
    get:
      operationId: getAlbumAccount
      responses:
        '200':
          description: Authenticated stable account
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [accountID]
                properties:
                  accountID: {type: string, format: uuid}
        default: {$ref: '#/components/responses/Error'}
  /v1/albums/library/versions:
    get:
      operationId: listAlbumAssetVersions
      parameters:
        - in: query
          name: after
          schema: {type: integer, format: int64, minimum: 0}
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 100}
      responses:
        '200':
          description: Immutable verified versions in owner-serialized publication order, not current gallery items
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AssetVersionPage'}
        default: {$ref: '#/components/responses/Error'}
  /v1/albums/library/versions/{versionID}:
    get:
      operationId: getAlbumAssetVersion
      parameters:
        - in: path
          name: versionID
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Account-scoped verified version without provider object locations
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AssetVersion'}
        default: {$ref: '#/components/responses/Error'}
  /v1/albums/library/versions/{versionID}/resources/{resourceID}/read-grant:
    post:
      operationId: authorizeAlbumOriginalRead
      parameters:
        - {name: versionID, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/ResourceID'}
      responses:
        '200':
          description: Five-minute account-owned GET grant pinned to an immutable verified object version; not a public share link
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OriginalReadGrant'}
        default: {$ref: '#/components/responses/Error'}
  /v1/albums/library/versions/{versionID}/photo-previews/{preset}/read-grant:
    post:
      operationId: authorizeAlbumPhotoPreviewRead
      parameters:
        - {name: versionID, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: preset, in: path, required: true, schema: {$ref: '#/components/schemas/PhotoPreset'}}
      responses:
        '200':
          description: Five-minute owned immutable still-preview GET; does not authorize replacement or deletion, and does not include a Live Photo paired video
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PhotoPreviewReadGrant'}
        default: {$ref: '#/components/responses/Error'}
  /v1/albums/library/versions/{versionID}/video-previews/{preset}/read-grant:
    post:
      operationId: authorizeAlbumVideoPreviewRead
      parameters:
        - {name: versionID, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: preset, in: path, required: true, schema: {$ref: '#/components/schemas/VideoPreset'}}
      responses:
        '200':
          description: Five-minute owned immutable MP4 GET after asynchronous completion and quota commit; native decoding and system import are still required
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VideoPreviewReadGrant'}
        default: {$ref: '#/components/responses/Error'}
  /v1/albums/library/versions/{versionID}/live-previews/daily/read-grant:
    post:
      operationId: authorizeAlbumLivePhotoPreviewRead
      parameters:
        - {name: versionID, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Owned immutable JPEG and MP4 components with digest-bound source timing; requires native pairing and system readback and does not authorize replacement
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LivePhotoPreviewReadGrant'}
        default: {$ref: '#/components/responses/Error'}
  /v1/albums/uploads:
    post:
      operationId: createAlbumUpload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [requestID, manifest]
              properties:
                requestID: {type: string, format: uuid}
                manifest: {$ref: '#/components/schemas/Manifest'}
      responses:
        '201':
          description: Reserved or idempotently replayed upload
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Upload'}
        default: {$ref: '#/components/responses/Error'}
  /v1/albums/uploads/{id}:
    parameters:
      - {$ref: '#/components/parameters/UploadID'}
    get:
      operationId: getAlbumUpload
      responses:
        '200':
          description: Upload belonging to the authenticated account
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Upload'}
        default: {$ref: '#/components/responses/Error'}
  /v1/albums/uploads/{id}/grants:
    parameters:
      - {$ref: '#/components/parameters/UploadID'}
    post:
      operationId: authorizeAlbumUploadResources
      description: Empty body. Grants cover only the manifest's exact staging objects, never archived originals.
      responses:
        '200':
          description: Short-lived staging write grants
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [grants]
                properties:
                  grants:
                    type: array
                    items: {$ref: '#/components/schemas/Grant'}
        default: {$ref: '#/components/responses/Error'}
  /v1/albums/uploads/{id}/submit:
    parameters:
      - {$ref: '#/components/parameters/UploadID'}
    post:
      operationId: submitAlbumUpload
      description: Empty body. Queues verification; client receipts and hashes are not verification evidence.
      responses:
        '202':
          description: Durable verification job queued or previously submitted state returned
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Upload'}
        default: {$ref: '#/components/responses/Error'}
  /v1/albums/uploads/{id}/resources/{resourceID}/multipart:
    parameters:
      - {$ref: '#/components/parameters/UploadID'}
      - {$ref: '#/components/parameters/ResourceID'}
    post:
      operationId: initializeAlbumMultipart
      responses:
        '200':
          description: Account-owned multipart state; assembled is not verified backup
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MultipartSession'}
        default: {$ref: '#/components/responses/Error'}
    get:
      operationId: getAlbumMultipart
      responses:
        '200':
          description: Account-owned multipart state; assembled is not verified backup
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MultipartStatus'}
        default: {$ref: '#/components/responses/Error'}
  /v1/albums/uploads/{id}/resources/{resourceID}/multipart/parts/{partNumber}/grant:
    parameters:
      - {$ref: '#/components/parameters/UploadID'}
      - {$ref: '#/components/parameters/ResourceID'}
      - {name: partNumber, in: path, required: true, schema: {type: integer, minimum: 1, maximum: 10000}}
    post:
      operationId: authorizeAlbumMultipartPart
      responses:
        '200':
          description: Account-owned multipart state; assembled is not verified backup
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MultipartPartGrant'}
        default: {$ref: '#/components/responses/Error'}
  /v1/albums/uploads/{id}/resources/{resourceID}/multipart/complete:
    parameters:
      - {$ref: '#/components/parameters/UploadID'}
      - {$ref: '#/components/parameters/ResourceID'}
    post:
      operationId: completeAlbumMultipart
      responses:
        '200':
          description: Account-owned multipart state; assembled is not verified backup
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MultipartAssembly'}
        default: {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    AlbumAccount:
      type: http
      scheme: bearer
      description: Verified stable account authentication scoped to the albums application. App Attest alone is insufficient.
  parameters:
    ResourceID:
      name: resourceID
      in: path
      required: true
      schema: {type: string, pattern: '^[A-Za-z0-9_-]{1,96}$'}
    UploadID:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
  responses:
    Error:
      description: Authentication, scope, quota, state or service error. Internal provider details are not returned.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [code]
            properties:
              code: {type: string}
  schemas:
    LoginChallenge:
      type: object
      additionalProperties: false
      required: [id, nonce, proof, expiresAt]
      properties:
        id: {type: string, format: uuid}
        nonce: {type: string, minLength: 64, maxLength: 64}
        proof: {type: string, minLength: 43, maxLength: 43}
        expiresAt: {type: string, format: date-time}
    AlbumSession:
      type: object
      additionalProperties: false
      required: [token, expiresAt, accountID]
      properties:
        token: {type: string}
        expiresAt: {type: string, format: date-time}
        accountID: {type: string, format: uuid}
    ResourceDescriptor:
      type: object
      additionalProperties: false
      required: [photoKitType, filename, uniformTypeIdentifier]
      properties:
        photoKitType: {type: integer, minimum: 1, maximum: 2147483647}
        filename: {type: string, maxLength: 4096}
        uniformTypeIdentifier: {type: string, minLength: 1, maxLength: 512}
    Resource:
      type: object
      additionalProperties: false
      required: [id, role, sizeBytes, sha256]
      properties:
        id: {type: string, pattern: '^[A-Za-z0-9_-]{1,96}$'}
        role:
          type: string
          enum: [original_photo, original_video, paired_video, current_photo, current_video, adjustment, alternate]
        sizeBytes: {type: integer, format: int64, minimum: 1}
        sha256: {type: string, pattern: '^[A-Fa-f0-9]{64}$'}
        descriptor: {$ref: '#/components/schemas/ResourceDescriptor'}
    AssetLocation:
      type: object
      additionalProperties: false
      required: [latitude, longitude]
      properties:
        latitude: {type: number, format: double, minimum: -90, maximum: 90}
        longitude: {type: number, format: double, minimum: -180, maximum: 180}
        altitude: {type: number, format: double}
    AssetMetadata:
      type: object
      additionalProperties: false
      required: [pixelWidth, pixelHeight, durationMilliseconds, mediaSubtypes, favorite]
      properties:
        creationTimeMilliseconds: {type: integer, format: int64, minimum: -62135596800000, maximum: 253402300799999}
        pixelWidth: {type: integer, minimum: 1, maximum: 2147483647}
        pixelHeight: {type: integer, minimum: 1, maximum: 2147483647}
        durationMilliseconds: {type: integer, format: int64, minimum: 0}
        mediaSubtypes: {type: integer, format: int64, minimum: 0}
        favorite: {type: boolean}
        location: {$ref: '#/components/schemas/AssetLocation'}
    LivePhotoTiming:
      type: object
      additionalProperties: false
      required: [photoResourceID, videoResourceID, photoTimeMicroseconds, durationMicroseconds]
      properties:
        photoResourceID: {type: string, pattern: '^[A-Za-z0-9_-]{1,96}$'}
        videoResourceID: {type: string, pattern: '^[A-Za-z0-9_-]{1,96}$'}
        photoTimeMicroseconds: {type: integer, format: int64, minimum: 0, maximum: 3599999999}
        durationMicroseconds: {type: integer, format: int64, minimum: 1, maximum: 3600000000}
    LivePhotoPreviewReadGrant:
      type: object
      additionalProperties: false
      required: [assetID, versionID, manifestDigest, timing, photo, video, replacementEligible, expiresAt]
      properties:
        assetID: {type: string, pattern: '^[A-Za-z0-9_-]{1,96}$'}
        versionID: {type: string, format: uuid}
        manifestDigest: {type: string, pattern: '^[a-f0-9]{64}$'}
        timing: {$ref: '#/components/schemas/LivePhotoTiming'}
        photo: {$ref: '#/components/schemas/PhotoPreviewReadGrant'}
        video: {$ref: '#/components/schemas/VideoPreviewReadGrant'}
        replacementEligible: {type: boolean, enum: [false]}
        expiresAt: {type: string, format: date-time}
    Manifest:
      type: object
      additionalProperties: false
      required: [assetID, sourceRevision, kind, edited, resources]
      properties:
        assetID: {type: string, pattern: '^[A-Za-z0-9_-]{1,96}$'}
        sourceRevision: {type: string, minLength: 1, maxLength: 256}
        kind: {type: string, enum: [photo, video, live_photo]}
        edited: {type: boolean}
        metadata: {$ref: '#/components/schemas/AssetMetadata'}
        livePhotoTiming: {$ref: '#/components/schemas/LivePhotoTiming'}
        resources:
          type: array
          minItems: 1
          maxItems: 32
          items: {$ref: '#/components/schemas/Resource'}
    AssetVersion:
      type: object
      additionalProperties: false
      required: [sequence, assetID, versionID, manifestDigest, manifest, originalBytes, publishedAt]
      properties:
        sequence: {type: integer, format: int64, minimum: 1}
        assetID: {type: string, pattern: '^[A-Za-z0-9_-]{1,96}$'}
        versionID: {type: string, format: uuid}
        manifestDigest: {type: string, pattern: '^[a-f0-9]{64}$'}
        manifest: {$ref: '#/components/schemas/Manifest'}
        originalBytes: {type: integer, format: int64, minimum: 1}
        publishedAt: {type: string, format: date-time}
    AssetVersionPage:
      type: object
      additionalProperties: false
      required: [versions, nextSequence, hasMore]
      properties:
        versions:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/AssetVersion'}
        nextSequence: {type: integer, format: int64, minimum: 0}
        hasMore: {type: boolean}
    Upload:
      type: object
      additionalProperties: false
      required: [id, requestID, manifest, manifestDigest, state, originalBytes, derivedBudget, expiresAt]
      properties:
        id: {type: string, format: uuid}
        requestID: {type: string, format: uuid}
        manifest: {$ref: '#/components/schemas/Manifest'}
        manifestDigest: {type: string, pattern: '^[a-f0-9]{64}$'}
        state: {type: string, enum: [uploading, queued, verifying, originals_verified]}
        originalBytes: {type: integer, format: int64, minimum: 1}
        derivedBudget: {type: integer, format: int64, minimum: 1}
        expiresAt: {type: string, format: date-time}
    Grant:
      type: object
      additionalProperties: false
      required: [resourceID, url, headers, expiresAt]
      properties:
        resourceID: {type: string}
        url: {type: string, format: uri}
        headers:
          type: object
          additionalProperties: {type: string}
        expiresAt: {type: string, format: date-time}

    VideoPreset:
      type: string
      enum: [daily_mp4_1080_v1]
    VideoProfile:
      type: object
      additionalProperties: false
      required: [width, height, durationMilliseconds, frameRate, audioChannels]
      properties:
        width: {type: integer, minimum: 128, maximum: 1920}
        height: {type: integer, minimum: 128, maximum: 1920}
        durationMilliseconds: {type: integer, format: int64, minimum: 1, maximum: 3600000}
        frameRate: {type: number, format: double, minimum: 0, exclusiveMinimum: true, maximum: 60}
        audioChannels: {type: integer, minimum: 0, maximum: 2}
    VideoPreviewReadGrant:
      type: object
      additionalProperties: false
      required: [assetID, versionID, manifestDigest, preset, objectVersionID, sizeBytes, sha256, profile, contentType, replacementEligible, url, headers, expiresAt]
      properties:
        assetID: {type: string, pattern: '^[A-Za-z0-9_-]{1,96}$'}
        versionID: {type: string, format: uuid}
        manifestDigest: {type: string, pattern: '^[a-f0-9]{64}$'}
        preset: {$ref: '#/components/schemas/VideoPreset'}
        objectVersionID: {type: string, minLength: 1, maxLength: 1024}
        sizeBytes: {type: integer, format: int64, minimum: 1, maximum: 4294967296}
        sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        profile: {$ref: '#/components/schemas/VideoProfile'}
        contentType: {type: string, enum: [video/mp4]}
        replacementEligible: {type: boolean, enum: [false]}
        url: {type: string, format: uri}
        headers:
          type: object
          additionalProperties: {type: string}
        expiresAt: {type: string, format: date-time}

    PhotoPreset:
      type: string
      enum: [grid_jpeg_v1, daily_jpeg_v1, grid_png_v1, daily_png_v1]
    PhotoPreviewReadGrant:
      type: object
      additionalProperties: false
      required: [assetID, versionID, manifestDigest, preset, objectVersionID, sizeBytes, sha256, width, height, contentType, replacementEligible, url, headers, expiresAt]
      properties:
        assetID: {type: string, pattern: '^[A-Za-z0-9_-]{1,96}$'}
        versionID: {type: string, format: uuid}
        manifestDigest: {type: string, pattern: '^[a-f0-9]{64}$'}
        preset: {$ref: '#/components/schemas/PhotoPreset'}
        objectVersionID: {type: string, minLength: 1, maxLength: 1024}
        sizeBytes: {type: integer, format: int64, minimum: 1, maximum: 33554432}
        sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        width: {type: integer, minimum: 1, maximum: 2560}
        height: {type: integer, minimum: 1, maximum: 2560}
        contentType: {type: string, enum: [image/jpeg, image/png]}
        replacementEligible: {type: boolean, enum: [false]}
        url: {type: string, format: uri}
        headers:
          type: object
          additionalProperties: {type: string}
        expiresAt: {type: string, format: date-time}

    OriginalReadGrant:
      type: object
      additionalProperties: false
      required: [assetID, versionID, manifestDigest, resourceID, objectVersionID, sizeBytes, sha256, url, headers, expiresAt]
      properties:
        assetID: {type: string, pattern: '^[A-Za-z0-9_-]{1,96}$'}
        versionID: {type: string, format: uuid}
        manifestDigest: {type: string, pattern: '^[a-f0-9]{64}$'}
        resourceID: {type: string, pattern: '^[A-Za-z0-9_-]{1,96}$'}
        objectVersionID: {type: string, minLength: 1, maxLength: 1024}
        sizeBytes: {type: integer, format: int64, minimum: 1}
        sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        url: {type: string, format: uri}
        headers:
          type: object
          additionalProperties: {type: string}
        expiresAt: {type: string, format: date-time}

    MultipartSession:
      type: object
      additionalProperties: false
      required: [resourceID, sizeBytes, partSize, partCount]
      properties:
        resourceID: {type: string}
        sizeBytes: {type: integer, format: int64, minimum: 1}
        partSize: {type: integer, format: int64, minimum: 1}
        partCount: {type: integer, minimum: 1, maximum: 10000}
    MultipartPartGrant:
      type: object
      additionalProperties: false
      required: [resourceID, url, headers, expiresAt, partNumber, offset, sizeBytes]
      properties:
        resourceID: {type: string}
        url: {type: string, format: uri}
        headers:
          type: object
          additionalProperties: {type: string}
        expiresAt: {type: string, format: date-time}
        partNumber: {type: integer, minimum: 1, maximum: 10000}
        offset: {type: integer, format: int64, minimum: 0}
        sizeBytes: {type: integer, format: int64, minimum: 1}
    MultipartUploadedPart:
      type: object
      additionalProperties: false
      required: [partNumber, sizeBytes]
      properties:
        partNumber: {type: integer, minimum: 1, maximum: 10000}
        sizeBytes: {type: integer, format: int64, minimum: 1}
    MultipartStatus:
      type: object
      additionalProperties: false
      required: [resourceID, state, parts]
      properties:
        resourceID: {type: string}
        state: {type: string, enum: [pending, uploading, assembled]}
        parts:
          type: array
          maxItems: 10000
          items: {$ref: '#/components/schemas/MultipartUploadedPart'}
    MultipartAssembly:
      type: object
      additionalProperties: false
      required: [resourceID, state]
      properties:
        resourceID: {type: string}
        state: {type: string, enum: [assembled]}
