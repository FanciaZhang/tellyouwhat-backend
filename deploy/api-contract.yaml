openapi: 3.1.0
info:
  title: Tellyouwhat Multi-App Backend
  version: 2.0.0
servers:
  - url: https://api.health.tellyouwhat.cn
    description: 告你健康
  - url: https://api.journal.tellyouwhat.cn
    description: 告你手记
paths:
  /healthz:
    get:
      responses:
        "200": { description: Healthy for the App selected by Host }
  /readyz:
    get:
      responses:
        "200": { description: App runtime ready }
        "503": { description: App dependency unavailable }
  /v1/attest/challenges:
    post:
      responses:
        "201": { description: App-scoped one-time challenge }
  /v1/attest/keys:
    post:
      responses:
        "201": { description: App-scoped App Attest key registered }
        "401": { description: Enrollment denied }
        "409": { description: Challenge replay }
  /v1/dev/entitlements/activate:
    post:
      responses:
        "200": { description: Development entitlement active }
        "404": { description: Absent in production }
  /v1/entitlements/transactions:
    post:
      responses:
        "200": { description: App-scoped managed subscription confirmed }
        "403": { description: Transaction invalid or subscription inactive }
  /v1/app-store/notifications:
    post:
      description: App Store Server Notifications V2. Host selects the receiving App before JWS verification.
      responses:
        "200": { description: Notification processed idempotently }
  /v1/privacy/consents:
    post:
      responses:
        "200": { description: Versioned App-scoped consents recorded }
  /v1/privacy/data:
    delete:
      responses:
        "204": { description: Caller data deleted only within the selected App }
  /v1/ai/quota:
    get:
      responses:
        "200": { description: Current App subscription quota }
  /v1/ai/operations/{operation}/responses:
    parameters:
      - in: path
        name: operation
        required: true
        schema:
          type: string
          enum:
            - health.voice.transcription
            - health.meal.photo-capture
            - health.meal.text-capture
            - health.meal.decision
            - health.diet.analysis
            - health.nutrition.analysis
            - health.behavior.analysis
            - journal.organize
    post:
      description: Fixed operation endpoint. Host and operation namespace must match. Journal requests contain content and context but never Prompt, model, provider URL, key, headers, or tools.
      responses:
        "200": { description: Strict structured response }
        "403": { description: Subscription or required consent missing }
        "422": { description: Contract or Host/operation mismatch }
        "426": { description: Health client contract upgrade required }
        "429": { description: App-scoped quota exceeded }
  /v1/ai/operations/{operation}/streams:
    post:
      description: Health fixed-operation SSE only.
      responses:
        "200":
          description: Server-sent event stream
          content:
            text/event-stream: {}
  /v1/ai/operations/{operation}/job-capabilities:
    post:
      description: Health background-job capability only.
      responses:
        "201": { description: App Attest-bound one-time capability }
  /v1/media/upload-authorizations:
    post:
      description: Health fixed-operation temporary media upload only.
      responses:
        "201": { description: App-prefixed restricted TOS PUT authorization }
  /v1/ai/jobs:
    post:
      responses:
        "202": { description: Health background job accepted }
  /v1/ai/jobs/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      responses:
        "200": { description: Job status }
    delete:
      responses:
        "204": { description: Job cancelled }
