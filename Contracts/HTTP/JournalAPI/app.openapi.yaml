openapi: 3.1.0
info:
  title: Journal Managed AI API
  version: 1.0.0
  description: >-
    Canonical App-specific operations for the 告你手记 managed-AI gateway.
    The generated public contract also includes the shared PlatformAPI.
servers:
- url: https://api.journal.tellyouwhat.cn
  description: Production
- url: http://127.0.0.1:8080
  description: Local development
tags:
- name: Journal
- name: AI
paths:
  /v1/journal/writing-styles:
    get:
      operationId: getJournalWritingStyles
      tags: [Journal]
      summary: Public writing style metadata. No prompts or provider settings.
      security: []
      parameters:
      - name: If-None-Match
        in: header
        schema: {type: string}
      responses:
        '200':
          description: The current writing style catalog.
          headers:
            ETag: {schema: {type: string}, required: true}
            Cache-Control: {schema: {type: string}, required: true}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WritingStyleCatalog'}
        '304':
          description: The cached catalog is current.
          headers:
            ETag: {schema: {type: string}, required: true}
            Cache-Control: {schema: {type: string}, required: true}
        default:
          "$ref": "#/components/responses/Error"
  "/v1/journal/voice/recordings/{recordingID}":
    put:
      operationId: uploadJournalRecording
      tags: [Journal]
      summary: Authenticated whole-recording processing; see docs/journal/recording-analysis-validation.md.
      security:
      - AppAttestKeyID: []
        AppAttestAssertion: []
        AppAttestNonce: []
        AppAttestTimestamp: []
        AppAttestRequestID: []
      parameters:
      - "$ref": "#/components/parameters/RequestIDHeader"
      - name: recordingID
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: X-Tellyouwhat-Content-SHA256
        in: header
        required: true
        description: SHA-256 of WAV bytes; also used as the App Attest canonical body digest and verified while streaming.
        schema: {type: string, pattern: '^[0-9a-f]{64}$'}
      requestBody:
        required: true
        content:
          audio/wav:
            schema: {type: string, format: binary}
      responses:
        '200':
          description: Recording task or validated preview.
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/RecordingTask"}
        '202':
          description: Recording uploaded or processing.
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/RecordingTask"}
        default:
          "$ref": "#/components/responses/Error"
    get:
      operationId: getJournalRecording
      tags: [Journal]
      summary: Authenticated whole-recording processing; see docs/journal/recording-analysis-validation.md.
      security:
      - AppAttestKeyID: []
        AppAttestAssertion: []
        AppAttestNonce: []
        AppAttestTimestamp: []
        AppAttestRequestID: []
      parameters:
      - "$ref": "#/components/parameters/RequestIDHeader"
      - name: recordingID
        in: path
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: Recording task or validated preview.
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/RecordingTask"}
        '202':
          description: Recording uploaded or processing.
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/RecordingTask"}
        default:
          "$ref": "#/components/responses/Error"
  "/v1/journal/voice/recordings/{recordingID}/process":
    post:
      operationId: processJournalRecording
      tags: [Journal]
      summary: Authenticated whole-recording processing; see docs/journal/recording-analysis-validation.md.
      security:
      - AppAttestKeyID: []
        AppAttestAssertion: []
        AppAttestNonce: []
        AppAttestTimestamp: []
        AppAttestRequestID: []
      parameters:
      - "$ref": "#/components/parameters/RequestIDHeader"
      - name: recordingID
        in: path
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: Recording task or validated preview.
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/RecordingTask"}
        '202':
          description: Recording uploaded or processing.
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/RecordingTask"}
        default:
          "$ref": "#/components/responses/Error"
  "/v1/journal/voice/recordings/{recordingID}/retry":
    post:
      operationId: retryJournalRecording
      tags: [Journal]
      summary: Authenticated whole-recording processing; see docs/journal/recording-analysis-validation.md.
      security:
      - AppAttestKeyID: []
        AppAttestAssertion: []
        AppAttestNonce: []
        AppAttestTimestamp: []
        AppAttestRequestID: []
      parameters:
      - "$ref": "#/components/parameters/RequestIDHeader"
      - name: recordingID
        in: path
        required: true
        schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: true}
      responses:
        '200':
          description: Recording task or validated preview.
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/RecordingTask"}
        '202':
          description: Recording uploaded or processing.
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/RecordingTask"}
        default:
          "$ref": "#/components/responses/Error"
  "/v1/journal/voice/recordings/{recordingID}/preview":
    post:
      operationId: previewJournalRecording
      tags: [Journal]
      summary: Authenticated whole-recording processing; see docs/journal/recording-analysis-validation.md.
      security:
      - AppAttestKeyID: []
        AppAttestAssertion: []
        AppAttestNonce: []
        AppAttestTimestamp: []
        AppAttestRequestID: []
      parameters:
      - "$ref": "#/components/parameters/RequestIDHeader"
      - name: recordingID
        in: path
        required: true
        schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: true}
      responses:
        '200':
          description: Recording task or validated preview.
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/RecordingPreviewResponse"}
        default:
          "$ref": "#/components/responses/Error"
  "/v1/journal/voice/sessions":
    post:
      operationId: createJournalVoiceSession
      tags: [Journal]
      summary: Admit an authenticated subscriber to a resumable voice session.
      security:
      - AppAttestKeyID: []
        AppAttestAssertion: []
        AppAttestNonce: []
        AppAttestTimestamp: []
        AppAttestRequestID: []
      parameters:
      - "$ref": "#/components/parameters/RequestIDHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/VoiceSessionRequest"
      responses:
        '201':
          description: A short-lived single-use WebSocket ticket.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/VoiceSessionTicket"
        default:
          "$ref": "#/components/responses/Error"
  "/v1/journal/voice/sessions/{sessionID}/stream":
    get:
      operationId: streamJournalVoiceSession
      tags: [Journal]
      summary: Upgrade to the voice protocol with a single-use bearer ticket.
      description: Audio and revision frames are described in docs/journal-voice.md. The ticket is never accepted in a URL.
      security:
      - VoiceSessionTicket: []
      parameters:
      - name: sessionID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '101':
          description: WebSocket upgrade accepted.
        default:
          "$ref": "#/components/responses/Error"
  "/v1/journal/organization":
    post:
      operationId: organizeJournal
      tags:
      - Journal
      - AI
      security:
      - AppAttestKeyID: []
        AppAttestAssertion: []
        AppAttestNonce: []
        AppAttestTimestamp: []
        AppAttestRequestID: []
      parameters:
      - "$ref": "#/components/parameters/RequestIDHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/OrganizeRequest"
      responses:
        '200':
          description: A validated set of tags and book suggestions.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OrganizeResponse"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '409':
          "$ref": "#/components/responses/Conflict"
        '413':
          "$ref": "#/components/responses/PayloadTooLarge"
        '422':
          "$ref": "#/components/responses/UnprocessableEntity"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
        '502':
          "$ref": "#/components/responses/BadGateway"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
        default:
          "$ref": "#/components/responses/Error"
  "/v1/journal/illustration-suggestions":
    post:
      operationId: suggestJournalIllustration
      tags: [Journal, AI]
      security:
      - AppAttestKeyID: []
        AppAttestAssertion: []
        AppAttestNonce: []
        AppAttestTimestamp: []
        AppAttestRequestID: []
      parameters:
      - "$ref": "#/components/parameters/RequestIDHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: {"$ref": "#/components/schemas/IllustrationSuggestionRequest"}
      responses:
        '200':
          description: Optional scene grounded in the supplied journal text.
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/IllustrationSuggestionResponse"}
        default:
          "$ref": "#/components/responses/Error"
  "/v1/journal/illustrations":
    post:
      operationId: createJournalIllustration
      tags: [Journal]
      security:
        - AppAttestKeyID: []
          AppAttestAssertion: []
          AppAttestNonce: []
          AppAttestTimestamp: []
          AppAttestRequestID: []
      parameters:
        - "$ref": "#/components/parameters/RequestIDHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/IllustrationRequest"
      responses:
        '200':
          description: Authenticated illustration operation result.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/IllustrationTask"
        default:
          "$ref": "#/components/responses/Error"
  "/v1/journal/illustrations/{taskID}":
    get:
      operationId: getJournalIllustration
      tags: [Journal]
      security:
        - AppAttestKeyID: []
          AppAttestAssertion: []
          AppAttestNonce: []
          AppAttestTimestamp: []
          AppAttestRequestID: []
      parameters:
        - "$ref": "#/components/parameters/RequestIDHeader"
        - name: taskID
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Authenticated illustration operation result.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/IllustrationTask"
        default:
          "$ref": "#/components/responses/Error"
  "/v1/journal/illustrations/{taskID}/cancel":
    post:
      operationId: cancelJournalIllustration
      tags: [Journal]
      security:
        - AppAttestKeyID: []
          AppAttestAssertion: []
          AppAttestNonce: []
          AppAttestTimestamp: []
          AppAttestRequestID: []
      parameters:
        - "$ref": "#/components/parameters/RequestIDHeader"
        - name: taskID
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/IllustrationCancellation"
      responses:
        '200':
          description: Authenticated illustration operation result.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/IllustrationTask"
        default:
          "$ref": "#/components/responses/Error"
  "/v1/journal/illustrations/{taskID}/result":
    get:
      operationId: getJournalIllustrationResult
      tags: [Journal]
      security:
        - AppAttestKeyID: []
          AppAttestAssertion: []
          AppAttestNonce: []
          AppAttestTimestamp: []
          AppAttestRequestID: []
      parameters:
        - "$ref": "#/components/parameters/RequestIDHeader"
        - name: taskID
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Authenticated illustration operation result.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/IllustrationResult"
        default:
          "$ref": "#/components/responses/Error"
components:
  securitySchemes:
    VoiceSessionTicket:
      type: http
      scheme: bearer
  responses:
    TooManyRequests:
      description: Quota or concurrency limit reached.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    BadGateway:
      description: Provider failed or returned an invalid result.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
  schemas:
    RecordingTask:
      type: object
      required: [id, providerTaskID, audioHash, milliseconds, state, revision, updatedAt]
      properties:
        id: {type: string, format: uuid}
        providerTaskID: {type: string, format: uuid}
        audioHash: {type: string, pattern: '^[0-9a-f]{64}$'}
        milliseconds: {type: integer, minimum: 1, maximum: 1800000}
        state: {type: string, enum: [uploaded, submitting, processing, completed, failed]}
        revision: {type: integer, minimum: 1}
        updatedAt: {type: string, format: date-time}
        errorCode: {type: string}
        result: {"$ref": "#/components/schemas/RecordingAnalysis"}
    RecordingAnalysis:
      type: object
      required: [taskID, version, milliseconds, text, utterances]
      properties:
        taskID: {type: string, format: uuid}
        version: {type: string, enum: [journal-recording-v1]}
        milliseconds: {type: integer, minimum: 1, maximum: 1800000}
        text: {type: string}
        utterances:
          type: array
          nullable: true
          items:
            type: object
            required: [id, speaker, startMilliseconds, endMilliseconds, text]
            properties:
              id: {type: string}
              speaker: {type: string}
              startMilliseconds: {type: integer, minimum: 0}
              endMilliseconds: {type: integer, minimum: 0}
              text: {type: string}
              acousticEmotion: {type: string}
    RecordingPreviewResponse:
      type: object
      required: [requestID, reviewRevision, revision]
      properties:
        requestID: {type: string, format: uuid}
        reviewRevision: {type: integer, minimum: 0}
        revision:
          type: object
          description: Validated Journal voice revision; see the voice protocol document.
          additionalProperties: true
    WritingStyleMetadata: {"type": "object", "additionalProperties": false, "required": ["id", "name", "description", "example", "order", "enabled"], "properties": {"id": {"type": "string"}, "name": {"type": "string"}, "description": {"type": "string"}, "example": {"type": "string"}, "order": {"type": "integer"}, "enabled": {"type": "boolean"}}}
    WritingStyleCatalog: {"type": "object", "additionalProperties": false, "required": ["version", "defaultStyle", "styles"], "properties": {"version": {"type": "string"}, "defaultStyle": {"type": "string"}, "styles": {"type": "array", "items": {"$ref": "#/components/schemas/WritingStyleMetadata"}}}}
    VoiceSessionRequest:
      type: object
      additionalProperties: false
      required: [sessionID, consentVersion]
      properties:
        sessionID:
          type: string
          format: uuid
        consentVersion:
          type: string
    VoiceSessionTicket:
      type: object
      additionalProperties: false
      required: [sessionID, token, remainingMilliseconds, maximumMilliseconds, resetsAt]
      properties:
        sessionID:
          type: string
          format: uuid
        token:
          type: string
        remainingMilliseconds:
          type: integer
        maximumMilliseconds:
          type: integer
        resetsAt:
          type: string
          format: date-time
    IllustrationSuggestion:
      type: object
      additionalProperties: false
      required: [summary, subject, setting, composition, style, sourceQuotes, reason]
      properties:
        summary: {type: string, minLength: 1, maxLength: 120}
        subject: {type: string, minLength: 1, maxLength: 500}
        setting: {type: string, maxLength: 500}
        composition: {type: string, maxLength: 500}
        style: {type: string, maxLength: 120}
        reason: {type: string, minLength: 1, maxLength: 240}
        sourceQuotes:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 600}
    OrganizeRequest:
      type: object
      additionalProperties: false
      required:
      - requestID
      - contractVersion
      - contentHash
      - title
      - body
      - existingTags
      - rejectedTagNames
      - books
      properties:
        requestID:
          type: string
          format: uuid
        contractVersion:
          type: string
          const: journal-organize-v1
        contentHash:
          type: string
          pattern: "^[a-f0-9]{64}$"
        title:
          type: string
          maxLength: 120
        body:
          type: string
          maxLength: 60000
        existingTags:
          type: array
          maxItems: 512
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 40
        rejectedTagNames:
          type: array
          maxItems: 512
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 40
        books:
          type: array
          maxItems: 128
          items:
            "$ref": "#/components/schemas/BookContext"
    BookContext:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - description
      - containsEntry
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 600
        containsEntry:
          type: boolean
    OrganizeResponse:
      type: object
      additionalProperties: false
      required:
      - requestID
      - contentHash
      - analysisVersion
      - tags
      - existingBookRecommendations
      - newBookSuggestions
      - quota
      properties:
        requestID:
          type: string
          format: uuid
        contentHash:
          type: string
          pattern: "^[a-f0-9]{64}$"
        analysisVersion:
          type: string
          minLength: 1
          maxLength: 128
        tags:
          type: array
          maxItems: 8
          items:
            "$ref": "#/components/schemas/Tag"
        existingBookRecommendations:
          type: array
          maxItems: 3
          items:
            "$ref": "#/components/schemas/ExistingBookRecommendation"
        newBookSuggestions:
          type: array
          maxItems: 2
          items:
            "$ref": "#/components/schemas/NewBookSuggestion"
        quota:
          "$ref": "#/components/schemas/OrganizeQuota"
    Tag:
      type: object
      additionalProperties: false
      required:
      - name
      - type
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
        type:
          type: string
          enum:
          - person
          - place
          - organization
          - event
          - topic
          - mood
          - other
    ExistingBookRecommendation:
      type: object
      additionalProperties: false
      required:
      - bookID
      - reason
      properties:
        bookID:
          type: string
          format: uuid
        reason:
          type: string
          minLength: 1
          maxLength: 240
    NewBookSuggestion:
      type: object
      additionalProperties: false
      required:
      - name
      - description
      - reason
      - relatedTags
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 600
        reason:
          type: string
          minLength: 1
          maxLength: 240
        relatedTags:
          type: array
          maxItems: 8
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 40
    OrganizeQuota:
      type: object
      additionalProperties: false
      required:
      - dailyTokensRemaining
      - monthlyTokensRemaining
      - available
      properties:
        dailyTokensRemaining:
          type: integer
          minimum: 0
        monthlyTokensRemaining:
          type: integer
          minimum: 0
        available:
          type: boolean

    IllustrationSuggestionRequest:
      type: object
      additionalProperties: false
      required: [requestID, contentHash, title, body]
      properties:
        requestID: {type: string, format: uuid}
        contentHash: {type: string, pattern: '^[a-f0-9]{64}$'}
        title: {type: string, maxLength: 120}
        body: {type: string, minLength: 1, maxLength: 60000}

    IllustrationSuggestionResponse:
      type: object
      additionalProperties: false
      required: [requestID, contentHash, analysisVersion, quota]
      properties:
        requestID: {type: string, format: uuid}
        contentHash: {type: string, pattern: '^[a-f0-9]{64}$'}
        analysisVersion: {type: string, minLength: 1, maxLength: 128}
        suggestion: {"$ref": "#/components/schemas/IllustrationSuggestion"}
        quota: {"$ref": "#/components/schemas/OrganizeQuota"}

    IllustrationRequest:
      type: object
      additionalProperties: false
      required: [requestID, versionID, brief, consentRevision]
      properties:
        requestID: {type: string, format: uuid}
        versionID: {type: string, format: uuid}
        brief: {"$ref": "#/components/schemas/IllustrationBrief"}
        consentRevision: {type: string, minLength: 1, maxLength: 128}
        referenceSHA256: {type: string, pattern: '^[a-f0-9]{64}$'}
        reference: {type: string, format: byte, maxLength: 33333336}

    IllustrationBrief:
      type: object
      additionalProperties: false
      required: [title, details]
      properties:
        title: {type: string, minLength: 1, maxLength: 300}
        details:
          type: array
          minItems: 1
          maxItems: 64
          items: {"$ref": "#/components/schemas/IllustrationDetail"}

    IllustrationDetail:
      type: object
      additionalProperties: false
      required: [kind, text]
      properties:
        kind: {type: string, enum: [subject, setting, composition, style, other]}
        text: {type: string, minLength: 1, maxLength: 8000}

    IllustrationCancellation:
      type: object
      additionalProperties: false
      required: [revision]
      properties:
        revision: {type: integer, format: int64, minimum: 1}

    IllustrationTask:
      type: object
      additionalProperties: false
      required: [id, versionID, state, revision, expiresAt]
      properties:
        id: {type: string, format: uuid}
        versionID: {type: string, format: uuid}
        state:
          type: string
          enum: [queued, running, succeeded, rejected, uncertain, cancelled]
        revision: {type: integer, format: int64, minimum: 1}
        expiresAt: {type: string, format: date-time}
        problem:
          type: string
          enum: [network, unavailable, quota, rejected, invalidImage]

    IllustrationResult:
      type: object
      additionalProperties: false
      required: [image, mime, width, height]
      properties:
        image: {type: string, format: byte, maxLength: 33333336}
        mime: {type: string, enum: [image/png, image/jpeg]}
        width: {type: integer, minimum: 1, maximum: 16000}
        height: {type: integer, minimum: 1, maximum: 16000}
