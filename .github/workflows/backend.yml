name: Backend CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deployment:
        description: Deployment acceptance stage
        required: true
        default: none
        type: choice
        options:
          - none
          - internal
          - public

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_PREFIX: ghcr.io/fanciazhang/tellyouwhat-ai

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      full: ${{ steps.evidence.outputs.full }}
      albums: ${{ steps.evidence.outputs.albums }}
      swift: ${{ steps.evidence.outputs.swift }}
      images: ${{ steps.evidence.outputs.images }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - id: evidence
        run: python3 scripts/ci_evidence.py plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    needs: plan
    if: needs.plan.outputs.full == ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.4@sha256:76f0358884cb92d9a086d24e5671c38048d3fef40f2588703d73eb55392d6b69
        env:
          MYSQL_DATABASE: tellyouwhat_test
          MYSQL_USER: tellyouwhat_test
          MYSQL_PASSWORD: ci-test-password
          MYSQL_ROOT_PASSWORD: ci-test-root-password
        ports:
          - 3306/tcp
        options: >-
          --tmpfs /var/lib/mysql:rw,size=2g
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:8-alpine@sha256:0bf6577d7774e592b29d093e3ac9390eb91e13d72c21e506afce736de5e0eeb0
        ports:
          - 6379/tcp
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate workflow syntax and reusable deployment inputs
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - run: bash deploy/tencent/deploy-production_test.sh
      - run: bash deploy/tencent/verify-public_test.sh
      - name: Test operations and rollback protections
        run: |
          python3 -m unittest discover -s deploy/tencent -p '*_test.py' -v
          python3 -m unittest discover -s scripts -p '*_test.py' -v
      - name: Verify privacy-safe encrypted backup restoration
        run: python3 deploy/tencent/backup_mysql_integration.py
        env:
          BACKUP_TEST_MYSQL_HOST: 127.0.0.1
          BACKUP_TEST_MYSQL_PORT: ${{ job.services.mysql.ports['3306'] }}
          BACKUP_TEST_MYSQL_USER: root
          BACKUP_TEST_MYSQL_PASSWORD: ci-test-root-password
      - name: Validate deployment files
        run: |
          touch .env.production
          docker compose -f compose.production.yaml config --quiet
          ARK_MANAGEMENT_CREDENTIAL_HOST_FILE=/tmp/ark-test-credentials.json docker compose -f compose.production.yaml -f compose.ark-management.yaml config --quiet
          JOURNAL_RECORDING_ROOT=/opt/tellyouwhat/journal-recordings/production docker compose --profile operations -f compose.production.yaml -f compose.journal-recording.yaml config --quiet
        env:
          HEALTH_API_DOMAIN: api.health.example
          JOURNAL_API_DOMAIN: api.journal.example
          ADMIN_DOMAIN: admin.example
          ACME_EMAIL: ops@example.com
          MYSQL_USER: app
          MYSQL_PASSWORD: placeholder
          MYSQL_DATABASE: app
          REDIS_PASSWORD: placeholder
      - name: Validate isolated album test stack
        run: |
          cp deploy/albums/runtime.env.example "$RUNNER_TEMP/albums-test.env"
          docker compose --env-file deploy/albums/test.env.example -f compose.albums-test.yaml config --quiet
        env:
          ALBUM_TEST_ENV_FILE: ${{ runner.temp }}/albums-test.env
          ALBUM_TEST_IMAGE_TAG: ${{ github.sha }}
          ALBUM_TEST_MYSQL_PASSWORD: ci-placeholder
          ALBUM_TEST_MYSQL_ROOT_PASSWORD: ci-root-placeholder
          ALBUM_TEST_REDIS_PASSWORD: ci-placeholder
      - name: Validate Caddy configuration
        run: |
          for config in Caddyfile Caddyfile.external; do
            docker run --rm --entrypoint caddy \
              -e HEALTH_API_DOMAIN=api.health.example \
              -e JOURNAL_API_DOMAIN=api.journal.example \
              -e ADMIN_DOMAIN=admin.example \
              -e ACME_EMAIL=ops@example.com \
              -v "${{ github.workspace }}/deploy/single-server/$config:/etc/caddy/Caddyfile:ro" \
              caddy:2-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f validate --config /etc/caddy/Caddyfile
          done
          docker run --rm --entrypoint caddy \
            -e ALBUM_API_DOMAIN=api.albums.example \
            -e ALBUM_TEST_API_PORT=18090 \
            -v "${{ github.workspace }}/deploy/albums/Caddyfile.external:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f validate --config /etc/caddy/Caddyfile

      - name: Test with MySQL and Redis
        run: |
          test -n "$MYSQL_TEST_DSN"
          test -n "$MYSQL_TEST_ADMIN_DSN"
          test -n "$REDIS_TEST_URL"
          packages=$(go list ./... | awk '!/\/internal\/albums$/')
          go test -timeout=30m -count=1 -v $packages
        env:
          MYSQL_TEST_DSN: tellyouwhat_test:ci-test-password@tcp(127.0.0.1:${{ job.services.mysql.ports['3306'] }})/tellyouwhat_test?charset=utf8mb4&collation=utf8mb4_0900_ai_ci
          MYSQL_TEST_ADMIN_DSN: root:ci-test-root-password@tcp(127.0.0.1:${{ job.services.mysql.ports['3306'] }})/tellyouwhat_test?charset=utf8mb4&collation=utf8mb4_0900_ai_ci
          REDIS_TEST_URL: redis://127.0.0.1:${{ job.services.redis.ports['6379'] }}/0
      - name: Test Albums with real storage
        if: needs.plan.outputs.albums == ''
        run: python3 scripts/run_album_tests.py
        env:
          MYSQL_TEST_DSN: tellyouwhat_test:ci-test-password@tcp(127.0.0.1:${{ job.services.mysql.ports['3306'] }})/tellyouwhat_test?charset=utf8mb4&collation=utf8mb4_0900_ai_ci
          MYSQL_TEST_ADMIN_DSN: root:ci-test-root-password@tcp(127.0.0.1:${{ job.services.mysql.ports['3306'] }})/tellyouwhat_test?charset=utf8mb4&collation=utf8mb4_0900_ai_ci
          REDIS_TEST_URL: redis://127.0.0.1:${{ job.services.redis.ports['6379'] }}/0
      - name: Verify real Caddy switching and long connections
        run: |
          container=$(docker create caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b)
          trap 'docker rm "$container" >/dev/null' EXIT
          docker cp "$container:/usr/bin/caddy" "$RUNNER_TEMP/caddy"
          chmod +x "$RUNNER_TEMP/caddy"
          CADDY_TEST_BIN="$RUNNER_TEMP/caddy" go test -race -count=1 -v ./internal/lifecycle
      - run: go vet ./...
      - run: go build ./cmd/...
      - run: make verify-generated
      - run: swift test --package-path Contracts/HTTP
        if: needs.plan.outputs.swift == ''
      - name: Record verified source and test inputs
        run: python3 scripts/ci_evidence.py record "$RUNNER_TEMP/verification.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backend-verification-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verification.json
          retention-days: 14
          overwrite: true

  container:
    needs: [plan, verify]
    if: >-
      always() && needs.plan.result == 'success' &&
      (needs.verify.result == 'success' || (needs.verify.result == 'skipped' && needs.plan.outputs.full != '')) &&
      needs.plan.outputs.images == ''
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, worker, admin, adminctl, migrate, maintenance, albumgateway, albumworker]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - name: Bind image provenance to the selected source
        id: source
        run: |
          set -euo pipefail
          archive_sha256=$(git archive "$GITHUB_SHA" | sha256sum | cut -d ' ' -f 1)
          echo "archive_sha256=$archive_sha256" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build service image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        env:
          DOCKER_BUILD_RECORD_RETENTION_DAYS: 1
        with:
          context: .
          file: Dockerfile
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:main
          build-args: SERVICE=${{ matrix.service }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            cn.tellyouwhat.source-tar-sha256=${{ steps.source.outputs.archive_sha256 }}
            cn.tellyouwhat.source-run=${{ github.run_id }}

  deploy:
    needs: [plan, verify, container]
    if: >-
      always() && github.ref == 'refs/heads/main' && needs.plan.result == 'success' &&
      (needs.verify.result == 'success' || (needs.verify.result == 'skipped' && needs.plan.outputs.full != '')) &&
      (needs.container.result == 'success' || (needs.container.result == 'skipped' && needs.plan.outputs.images != '')) &&
      ((github.event_name == 'push' && vars.PRODUCTION_DEPLOY_ENABLED == 'true') ||
       (github.event_name == 'workflow_dispatch' && inputs.deployment != 'none'))
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy.yml
    with:
      acceptance: ${{ github.event_name == 'push' && (vars.PRODUCTION_ACCEPTANCE_STAGE || 'internal') || inputs.deployment }}
      source_run: ${{ needs.plan.outputs.images || format('{0}', github.run_id) }}
    secrets: inherit

  verify-public:
    needs: deploy
    if: >-
      needs.deploy.result == 'success' &&
      ((github.event_name == 'push' && vars.PRODUCTION_ACCEPTANCE_STAGE == 'public') || inputs.deployment == 'public')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Verify all public runtimes
        env:
          PUBLIC_TARGETS: ${{ needs.deploy.outputs.public_targets }}
        run: |
          bash deploy/tencent/verify-public.sh "$PUBLIC_TARGETS"
          printf 'Public HTTPS verified for %s across all selected Apps and admin.\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
