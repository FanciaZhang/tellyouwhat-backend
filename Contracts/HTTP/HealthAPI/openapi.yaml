openapi: 3.1.0
info:
  title: Health Managed AI API
  version: 1.0.0
  description: |
    Canonical HTTP contract for the 告你健康 managed-AI gateway.
    This document is the single source used to generate the Go router and
    Swift/Web clients. The AI prompt/schema manifest is a separate business
    contract and is not duplicated here.
servers:
  - url: https://api.health.tellyouwhat.cn
    description: Production
  - url: http://127.0.0.1:8080
    description: Local development
tags:
  - name: Service
  - name: Products
  - name: Attestation
  - name: Entitlements
  - name: Privacy
  - name: Media
  - name: AI
  - name: Jobs
  - name: Apple
paths:
  /healthz:
    get:
      operationId: getHealth
      tags: [Service]
      summary: Process health check
      security: []
      responses:
        "200":
          description: The process is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceStatus"
        default:
          $ref: "#/components/responses/Error"
  /readyz:
    get:
      operationId: getReadiness
      tags: [Service]
      summary: Dependency readiness check
      security: []
      responses:
        "200":
          description: All required dependencies are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceStatus"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/Error"
  /v1/products/managed-ai:
    get:
      operationId: getManagedAIProduct
      tags: [Products]
      summary: Describe the managed-AI subscription product
      security: []
      responses:
        "200":
          description: Public product and policy metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedAIProduct"
        default:
          $ref: "#/components/responses/Error"
  /v1/attest/challenges:
    post:
      operationId: issueAttestationChallenge
      tags: [Attestation]
      summary: Issue a one-time App Attest challenge
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttestationChallengeRequest"
      responses:
        "201":
          description: A one-time challenge was issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttestationChallenge"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/Error"
  /v1/attest/keys:
    post:
      operationId: registerAttestationKey
      tags: [Attestation]
      summary: Register an App Attest key
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttestationRegistrationRequest"
      responses:
        "201":
          description: The App Attest key was registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttestationRegistrationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/Error"
  /v1/dev/entitlements/activate:
    post:
      operationId: activateDevelopmentEntitlement
      tags: [Entitlements]
      summary: Activate a development-only managed entitlement
      description: The handler returns 404 when the production dependency set is active.
      security:
        - AppAttestKeyID: []
          AppAttestAssertion: []
          AppAttestNonce: []
          AppAttestTimestamp: []
          AppAttestRequestID: []
          DevelopmentActivation: []
      parameters:
        - $ref: "#/components/parameters/RequestIDHeader"
        - $ref: "#/components/parameters/DevelopmentActivationHeader"
      responses:
        "200":
          description: The development entitlement is active.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntitlementStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/Error"
  /v1/entitlements/transactions:
    post:
      operationId: synchronizeSubscriptionTransaction
      tags: [Entitlements]
      summary: Synchronize a locally verified StoreKit transaction
      security:
        - AppAttestKeyID: []
          AppAttestAssertion: []
          AppAttestNonce: []
          AppAttestTimestamp: []
          AppAttestRequestID: []
      parameters:
        - $ref: "#/components/parameters/RequestIDHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionTransactionRequest"
      responses:
        "200":
          description: The current managed subscription was confirmed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntitlementStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/Error"
  /v1/app-store/notifications:
    post:
      operationId: processAppStoreNotification
      tags: [Apple]
      summary: Receive an App Store Server Notification V2
      description: Apple JWS verification replaces App Attest on this route.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppStoreNotificationRequest"
      responses:
        "200":
          description: The notification was durably processed or was already processed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OKStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/Error"
  /v1/privacy/consents:
    post:
      operationId: recordPrivacyConsents
      tags: [Privacy]
      summary: Record the current privacy consent versions
      security:
        - AppAttestKeyID: []
          AppAttestAssertion: []
          AppAttestNonce: []
          AppAttestTimestamp: []
          AppAttestRequestID: []
      parameters:
        - $ref: "#/components/parameters/RequestIDHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrivacyConsentRequest"
      responses:
        "200":
          description: The consent records were stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivacyConsentResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/Error"
  /v1/privacy/data:
    delete:
      operationId: deletePrivacyData
      tags: [Privacy]
      summary: Delete all managed service data for the caller
      security:
        - AppAttestKeyID: []
          AppAttestAssertion: []
          AppAttestNonce: []
          AppAttestTimestamp: []
          AppAttestRequestID: []
      parameters:
        - $ref: "#/components/parameters/RequestIDHeader"
      responses:
        "204":
          description: All data was deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/Error"
  /v1/media/upload-authorizations:
    post:
      operationId: authorizeMediaUpload
      tags: [Media]
      summary: Authorize a restricted temporary TOS upload
      security:
        - AppAttestKeyID: []
          AppAttestAssertion: []
          AppAttestNonce: []
          AppAttestTimestamp: []
          AppAttestRequestID: []
      parameters:
        - $ref: "#/components/parameters/RequestIDHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaUploadAuthorizationRequest"
      responses:
        "201":
          description: A restricted temporary upload was authorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaUploadAuthorization"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/Error"
  /v1/ai/requests:
    post:
      operationId: completeAIRequest
      tags: [AI]
      summary: Complete a constrained managed-AI request
      security:
        - AppAttestKeyID: []
          AppAttestAssertion: []
          AppAttestNonce: []
          AppAttestTimestamp: []
          AppAttestRequestID: []
      parameters:
        - $ref: "#/components/parameters/RequestIDHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AIRequest"
      responses:
        "200":
          description: A schema-validated managed-AI result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/Error"
  /v1/ai/streams:
    post:
      operationId: streamAIRequest
      tags: [AI]
      summary: Stream a constrained managed-AI request as server-sent events
      description: |
        Emits `delta`, then one terminal `completed` event. An `error` event can
        terminate a stream after response headers have already been sent.
      security:
        - AppAttestKeyID: []
          AppAttestAssertion: []
          AppAttestNonce: []
          AppAttestTimestamp: []
          AppAttestRequestID: []
      parameters:
        - $ref: "#/components/parameters/RequestIDHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AIRequest"
      responses:
        "200":
          description: A server-sent event stream.
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                completion:
                  value: |-
                    event: delta
                    data: {"delta":"..."}

                    event: completed
                    data: {"requestID":"00000000-0000-4000-8000-000000000000","content":"{}","usage":{"inputTokens":1,"outputTokens":1}}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/Error"
  /v1/ai/quota:
    get:
      operationId: getAIQuota
      tags: [AI]
      summary: Read the current AI and free-recognition quota snapshot
      security:
        - AppAttestKeyID: []
          AppAttestAssertion: []
          AppAttestNonce: []
          AppAttestTimestamp: []
          AppAttestRequestID: []
      parameters:
        - $ref: "#/components/parameters/RequestIDHeader"
        - name: businessDayStartHour
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 23
            default: 4
        - name: timeZoneIdentifier
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 64
            default: Asia/Shanghai
      responses:
        "200":
          description: Daily and monthly token usage for the current subscription.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotaSnapshot"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/Error"
  /v1/ai/recognition-sessions/{id}:
    delete:
      operationId: cancelRecognitionSession
      tags: [AI]
      summary: Release an unfinished free meal-recognition reservation
      security:
        - AppAttestKeyID: []
          AppAttestAssertion: []
          AppAttestNonce: []
          AppAttestTimestamp: []
          AppAttestRequestID: []
      parameters:
        - $ref: "#/components/parameters/RequestIDHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Reservation released, or was already absent/completed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/Error"
  /v1/ai/recognition-sessions/{id}/complete:
    post:
      operationId: completeRecognitionSession
      tags: [AI]
      summary: Commit one successfully saved free meal-recognition session
      security:
        - AppAttestKeyID: []
          AppAttestAssertion: []
          AppAttestNonce: []
          AppAttestTimestamp: []
          AppAttestRequestID: []
      parameters:
        - $ref: "#/components/parameters/RequestIDHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Recognition session committed, including idempotent replays.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecognitionQuotaSnapshot"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/Error"
  /v1/ai/job-capabilities:
    post:
      operationId: issueAIJobCapability
      tags: [Jobs]
      summary: Issue an App Attest-bound one-time background job capability
      security:
        - AppAttestKeyID: []
          AppAttestAssertion: []
          AppAttestNonce: []
          AppAttestTimestamp: []
          AppAttestRequestID: []
      parameters:
        - $ref: "#/components/parameters/RequestIDHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AIRequest"
      responses:
        "201":
          description: A digest-bound one-time job capability.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobCapability"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/Error"
  /v1/ai/jobs:
    post:
      operationId: enqueueAIJob
      tags: [Jobs]
      summary: Enqueue a background managed-AI job
      security:
        - JobCapabilityAuthentication: []
          JobID: []
          AppAttestRequestID: []
      parameters:
        - $ref: "#/components/parameters/RequestIDHeader"
        - $ref: "#/components/parameters/JobIDHeader"
        - $ref: "#/components/parameters/JobCapabilityHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AIRequest"
      responses:
        "202":
          description: The durable background job was accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIJob"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/Error"
  /v1/ai/jobs/{id}:
    parameters:
      - $ref: "#/components/parameters/JobIDPath"
    get:
      operationId: getAIJob
      tags: [Jobs]
      summary: Read a background job
      security:
        - AppAttestKeyID: []
          AppAttestAssertion: []
          AppAttestNonce: []
          AppAttestTimestamp: []
          AppAttestRequestID: []
      parameters:
        - $ref: "#/components/parameters/RequestIDHeader"
      responses:
        "200":
          description: Current background job state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIJob"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: cancelAIJob
      tags: [Jobs]
      summary: Cancel a queued or running background job
      security:
        - AppAttestKeyID: []
          AppAttestAssertion: []
          AppAttestNonce: []
          AppAttestTimestamp: []
          AppAttestRequestID: []
      parameters:
        - $ref: "#/components/parameters/RequestIDHeader"
      responses:
        "204":
          description: The job was cancelled.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    AppAttestKeyID:
      type: apiKey
      in: header
      name: X-Health-Key-ID
      description: Registered App Attest key identifier.
    AppAttestAssertion:
      type: apiKey
      in: header
      name: X-Health-Assertion
      description: Base64-encoded App Attest assertion for the canonical request binding.
    AppAttestNonce:
      type: apiKey
      in: header
      name: X-Health-Nonce
      description: One-time challenge value.
    AppAttestTimestamp:
      type: apiKey
      in: header
      name: X-Health-Timestamp
      description: RFC 3339 assertion timestamp.
    AppAttestRequestID:
      type: apiKey
      in: header
      name: X-Health-Request-ID
      description: Lowercase UUID bound into the assertion.
    DevelopmentActivation:
      type: apiKey
      in: header
      name: X-Health-Dev-Activation
    JobCapabilityAuthentication:
      type: apiKey
      in: header
      name: X-Health-Job-Capability
      description: Digest-bound one-time background job capability.
    JobID:
      type: apiKey
      in: header
      name: X-Health-Job-ID
      description: Job UUID bound into the one-time capability.
  parameters:
    RequestIDHeader:
      in: header
      name: X-Health-Request-ID
      required: true
      schema:
        type: string
        format: uuid
    DevelopmentActivationHeader:
      in: header
      name: X-Health-Dev-Activation
      required: true
      schema:
        type: string
        minLength: 1
    JobIDHeader:
      in: header
      name: X-Health-Job-ID
      required: true
      schema:
        type: string
        format: uuid
    JobCapabilityHeader:
      in: header
      name: X-Health-Job-Capability
      required: true
      schema:
        type: string
        minLength: 1
    JobIDPath:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Error:
      description: An error response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRequest:
      description: The request envelope is malformed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication or one-time capability validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The caller is authenticated but lacks the required entitlement.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The route or resource does not exist for this caller.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: A replay, idempotency, or state conflict occurred.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PayloadTooLarge:
      description: The request exceeds an operation-specific size limit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnprocessableEntity:
      description: The request violates the managed business contract.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UpgradeRequired:
      description: The contract or prompt version is no longer supported.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: A rate, concurrency, daily, or monthly safety limit was reached.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadGateway:
      description: The managed AI provider failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: A required service dependency is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ServiceStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, ready]
    OKStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [code, message, requestID]
      properties:
        code:
          type: string
        message:
          type: string
        requestID:
          type: string
    ManagedAIProduct:
      type: object
      additionalProperties: false
      required:
        - productID
        - billingPeriod
        - dailyTokenLimit
        - monthlyTokenLimit
        - provider
        - modelDisclosure
        - mediaRetention
        - jobRetention
        - privacyURL
        - termsURL
        - privacyChoicesURL
        - supportURL
      properties:
        productID:
          type: string
        billingPeriod:
          type: string
          example: P1M
        dailyTokenLimit:
          type: integer
          minimum: 0
        monthlyTokenLimit:
          type: integer
          minimum: 0
        provider:
          type: string
        modelDisclosure:
          type: string
        mediaRetention:
          type: string
        jobRetention:
          type: string
        privacyURL:
          type: string
          format: uri
        termsURL:
          type: string
          format: uri
        privacyChoicesURL:
          type: string
          format: uri
        supportURL:
          type: string
          format: uri
    AttestationChallengeRequest:
      type: object
      additionalProperties: false
      required: [keyID]
      properties:
        keyID:
          type: string
          minLength: 1
          maxLength: 512
    AttestationChallenge:
      type: object
      additionalProperties: false
      required: [challenge, expiresAt]
      properties:
        challenge:
          type: string
          minLength: 1
        expiresAt:
          type: string
          format: date-time
    AttestationRegistrationRequest:
      type: object
      additionalProperties: false
      required: [keyID, challenge, attestation, build, activationSecret]
      properties:
        keyID:
          type: string
          minLength: 1
          maxLength: 512
        challenge:
          type: string
          minLength: 1
        attestation:
          type: string
          minLength: 1
          contentEncoding: base64
        build:
          type: string
        activationSecret:
          type: string
    AttestationRegistrationResponse:
      type: object
      additionalProperties: false
      required: [keyID, deviceID]
      properties:
        keyID:
          type: string
        deviceID:
          type: string
          format: uuid
    SubscriptionTransactionRequest:
      type: object
      additionalProperties: false
      required: [signedTransaction]
      properties:
        signedTransaction:
          type: string
          minLength: 1
    EntitlementStatus:
      type: object
      additionalProperties: false
      required: [status, expiresAt]
      properties:
        status:
          type: string
          const: active
        expiresAt:
          type: string
          format: date-time
    AppStoreNotificationRequest:
      type: object
      additionalProperties: false
      required: [signedPayload]
      properties:
        signedPayload:
          type: string
          minLength: 1
    PrivacyConsentRequest:
      type: object
      additionalProperties: false
      required: [consents]
      properties:
        consents:
          type: array
          minItems: 1
          maxItems: 6
          items:
            $ref: "#/components/schemas/PrivacyConsent"
    PrivacyConsent:
      type: object
      additionalProperties: false
      required: [scope, documentVersion, granted]
      properties:
        scope:
          type: string
          enum:
            - adult
            - privacy_and_terms
            - lifetime_byok
            - managed_subscription
            - free_managed_recognition
            - sensitive_health_ai
        documentVersion:
          type: string
        granted:
          type: boolean
    PrivacyConsentResponse:
      type: object
      additionalProperties: false
      required: [recordedAt, count]
      properties:
        recordedAt:
          type: string
          format: date-time
        count:
          type: integer
          minimum: 1
          maximum: 6
    MediaUploadAuthorizationRequest:
      type: object
      additionalProperties: false
      required: [requestID, operation, mediaID, kind, mimeType, sha256, sizeBytes]
      properties:
        requestID:
          type: string
          format: uuid
        operation:
          $ref: "#/components/schemas/AIOperation"
        mediaID:
          type: string
          minLength: 1
          maxLength: 96
        kind:
          type: string
          enum: [image, audio]
        mimeType:
          type: string
          enum:
            - image/jpeg
            - image/heic
            - image/png
            - audio/m4a
            - audio/mp4
            - audio/mpeg
            - audio/wav
        sha256:
          $ref: "#/components/schemas/SHA256"
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 26214400
        recognitionSession:
          $ref: "#/components/schemas/RecognitionSessionContext"
    MediaUploadAuthorization:
      type: object
      additionalProperties: false
      required: [objectID, uploadURL, requiredHeaders, expiresAt]
      properties:
        objectID:
          type: string
        uploadURL:
          type: string
          format: uri
        requiredHeaders:
          type: object
          additionalProperties:
            type: string
        expiresAt:
          type: string
          format: date-time
    AIRequest:
      type: object
      additionalProperties: false
      required:
        - requestID
        - operation
        - contractVersion
        - promptVersion
        - prompt
        - responseSchema
        - options
        - media
        - semanticSignature
      properties:
        requestID:
          type: string
          format: uuid
        operation:
          $ref: "#/components/schemas/AIOperation"
        contractVersion:
          type: string
          const: ai-request-v1
        promptVersion:
          type: string
          minLength: 1
        prompt:
          type: string
          minLength: 1
          maxLength: 524288
        responseSchema:
          type: object
          description: Inline strict JSON Schema selected by the registered prompt contract.
          additionalProperties: true
        options:
          $ref: "#/components/schemas/AIRequestOptions"
        media:
          type: array
          maxItems: 4
          items:
            $ref: "#/components/schemas/AIMedia"
        semanticSignature:
          type: string
          minLength: 1
          maxLength: 256
        recognitionSession:
          $ref: "#/components/schemas/RecognitionSessionContext"
    RecognitionSessionContext:
      type: object
      additionalProperties: false
      required: [sessionID, businessDayStartHour, timeZoneIdentifier]
      properties:
        sessionID:
          type: string
          format: uuid
        businessDayStartHour:
          type: integer
          minimum: 0
          maximum: 23
        timeZoneIdentifier:
          type: string
          minLength: 1
          maxLength: 64
    AIOperation:
      type: string
      enum:
        - voice_transcription
        - meal_photo_capture
        - hydration_cup_estimate
        - meal_text_capture
        - meal_decision
        - diet_analysis
        - health_nutrition_analysis
        - health_behavior_analysis
    AIRequestOptions:
      type: object
      additionalProperties: false
      properties:
        temperature:
          type: number
          format: double
          minimum: 0
          maximum: 2
        stream:
          type: boolean
          default: false
        reasoningEffort:
          type: string
          enum: [minimal, low, medium, high, max]
        webSearchEnabled:
          type: boolean
          default: false
    AIMedia:
      type: object
      additionalProperties: false
      required: [id, kind, mimeType, objectID, sha256, sizeBytes]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 96
        kind:
          type: string
          enum: [image, audio]
        mimeType:
          type: string
        objectID:
          type: string
          minLength: 1
        sha256:
          $ref: "#/components/schemas/SHA256"
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 26214400
    SHA256:
      type: string
      pattern: "^[a-f0-9]{64}$"
    TokenUsage:
      type: object
      additionalProperties: false
      required: [inputTokens, outputTokens]
      properties:
        inputTokens:
          type: integer
          minimum: 0
        outputTokens:
          type: integer
          minimum: 0
    AIResponse:
      type: object
      additionalProperties: false
      required: [requestID, content, usage]
      properties:
        requestID:
          type: string
          format: uuid
        content:
          type: string
        usage:
          $ref: "#/components/schemas/TokenUsage"
    QuotaSnapshot:
      type: object
      additionalProperties: false
      required:
        - plan
        - dailyUsed
        - dailyLimit
        - dailyResetAt
        - monthlyUsed
        - monthlyLimit
        - monthlyResetAt
        - recognitionCompleted
        - recognitionReserved
        - recognitionRemaining
        - recognitionResetAt
      properties:
        plan:
          type: string
          enum: [free, managed_subscription]
        dailyUsed:
          type: integer
          minimum: 0
        dailyLimit:
          type: integer
          minimum: 0
        dailyResetAt:
          type: string
          format: date-time
        monthlyUsed:
          type: integer
          minimum: 0
        monthlyLimit:
          type: integer
          minimum: 0
        monthlyResetAt:
          type: string
          format: date-time
        recognitionCompleted:
          type: integer
          minimum: 0
        recognitionReserved:
          type: integer
          minimum: 0
        recognitionRemaining:
          type: integer
          minimum: 0
        recognitionResetAt:
          type: string
          format: date-time
    RecognitionQuotaSnapshot:
      type: object
      additionalProperties: false
      required: [completed, reserved, remaining, resetAt]
      properties:
        completed:
          type: integer
          minimum: 0
        reserved:
          type: integer
          minimum: 0
        remaining:
          type: integer
          minimum: 0
        resetAt:
          type: string
          format: date-time
    JobCapability:
      type: object
      additionalProperties: false
      required: [jobID, token, expiresAt]
      properties:
        jobID:
          type: string
          format: uuid
        token:
          type: string
          minLength: 1
        expiresAt:
          type: string
          format: date-time
    AIJob:
      type: object
      additionalProperties: false
      required: [jobID, requestID, status, createdAt, updatedAt]
      properties:
        jobID:
          type: string
          format: uuid
        requestID:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, running, succeeded, failed, cancelled]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        content:
          type: string
        usage:
          $ref: "#/components/schemas/TokenUsage"
        errorCategory:
          type: string
