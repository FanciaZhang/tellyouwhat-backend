openapi: 3.0.3
info:
  title: Album Account and Upload API
  version: 0.1.0
  description: Account-owned durable upload staging. originals_verified does not mean previews or local replacement are ready.
security:
  - AlbumAccount: []
paths:
  /v1/albums/auth/challenges:
    post:
      operationId: createAlbumLoginChallenge
      security: []
      responses:
        '201':
          description: Single-use Apple login challenge; nonce is already hashed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LoginChallenge'}
        default: {$ref: '#/components/responses/Error'}
  /v1/albums/auth/apple:
    post:
      operationId: loginAlbumWithApple
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challengeID, proof, authorizationCode, identityToken]
              properties:
                challengeID: {type: string, format: uuid}
                proof: {type: string, minLength: 43, maxLength: 43}
                authorizationCode: {type: string, minLength: 1, maxLength: 4096}
                identityToken: {type: string, minLength: 1, maxLength: 65536}
      responses:
        '200':
          description: Account session; store token in Keychain
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AlbumSession'}
        default: {$ref: '#/components/responses/Error'}
  /v1/albums/auth/logout:
    post:
      operationId: logoutAlbumSession
      description: Revokes only the presented opaque session credential, including expired sessions. No account ID is accepted; retries are idempotent.
      responses:
        '204': {description: Current session revoked}
        default: {$ref: '#/components/responses/Error'}
  /v1/albums/notifications/registration:
    get:
      operationId: getAlbumPushRegistration
      responses:
        '200':
          description: Current session registration; absent registration has revision zero and state disabled
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PushRegistration'}
        default: {$ref: '#/components/responses/Error'}
    put:
      operationId: updateAlbumPushRegistration
      description: Explicit notification preference for the authenticated session. Environment is server configured. A conflict requires rereading state; never silently overwrite it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [requestID, expectedRevision, enabled]
              properties:
                requestID: {type: string, format: uuid}
                expectedRevision: {type: integer, format: int64, minimum: 0, maximum: 9223372036854775806}
                enabled: {type: boolean}
                deviceToken:
                  type: string
                  minLength: 2
                  maxLength: 1024
                  pattern: '^(?:[0-9a-f]{2})+$'
                  description: Required only when enabled; omit when disabling. Canonical lowercase APNs token, never an account identifier.
      responses:
        '200':
          description: Committed registration or exact replay
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PushRegistration'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /v1/albums/account:
    get:
      operationId: getAlbumAccount
      responses:
        '200':
          description: Authenticated stable account
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [accountID]
                properties:
                  accountID: {type: string, format: uuid}
        default: {$ref: '#/components/responses/Error'}
  /v1/albums/account/deletion:
    post:
      operationId: requestAlbumAccountDeletion
      description: Disabled in deployed Gateway until complete erasure is available. Accepts a user-confirmed deletion request and revokes account access atomically. A 202 receipt means accepted, never completed. Persist requestID before sending; retry with the same original bearer credential and requestID after a lost response, even if that credential is now revoked or expired. No account ID is accepted. This does not cancel an Apple subscription or delete system Photos assets.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [requestID]
              properties:
                requestID: {type: string, format: uuid}
      responses:
        '202':
          description: Durable acceptance or exact replay of the same accepted request
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [requestID, requestedAt, state]
                properties:
                  requestID: {type: string, format: uuid}
                  requestedAt: {type: string, format: date-time}
                  state: {type: string, enum: [accepted]}
        '401': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /v1/albums/subscription:
    get:
      operationId: getAlbumSubscription
      responses:
        '200':
          description: Current account capacity and six-calendar-month retention deadline; prices are supplied by StoreKit
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AlbumCloudAccount'}
        default: {$ref: '#/components/responses/Error'}
  /v1/albums/auth/apple/notifications:
    post:
      operationId: receiveAlbumAppleNotification
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [payload]
              properties:
                payload: {type: string, minLength: 1, maxLength: 32768}
      responses:
        '200': {description: 'Verified Apple identity fence committed; repeated or older events cannot revoke newer consent'}
        default: {$ref: '#/components/responses/Error'}
  /v1/albums/subscription/notifications:
    post:
      operationId: receiveAlbumSubscriptionNotification
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [signedPayload]
              properties:
                signedPayload: {type: string, minLength: 1, maxLength: 1048576}
      responses:
        '200': {description: 'Verified notification and current entitlement update committed, or verified identical event already processed'}
        default: {$ref: '#/components/responses/Error'}
  /v1/albums/subscription/transactions:
    post:
      operationId: syncAlbumSubscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [signedTransaction]
              properties:
                signedTransaction: {type: string, minLength: 1, maxLength: 1048576}
      responses:
        '200':
          description: Verified Apple current status bound to this stable account; no client quota or expiry fields
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AlbumCloudAccount'}
        default: {$ref: '#/components/responses/Error'}
  /v1/albums/library/changes:
    get:
      operationId: listAlbumLibraryChanges
      description: Independent event cursor; apply each page atomically. Trashed events remove a version from browsing without deleting system media. Restores publish full version metadata again.
      parameters:
        - {name: after, in: query, schema: {type: integer, format: int64, minimum: 0}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
      responses:
        '200':
          description: Owner-scoped publication, trash and restoration events, bounded to one MiB
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LibraryChangePage'}
        default: {$ref: '#/components/responses/Error'}
  /v1/albums/library/assets/{assetID}:
    get:
      operationId: getAlbumCloudAsset
      parameters:
        - {$ref: '#/components/parameters/AssetID'}
      responses:
        '200':
          description: Logical cloud state; restoreUntil is bounded by current account retention
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CloudAssetState'}
        default: {$ref: '#/components/responses/Error'}
  /v1/albums/library/assets/{assetID}/trash:
    post:
      operationId: trashAlbumCloudAsset
      description: Applies to all historical versions. Requires the observed logical revision and a fresh request ID for new intent. Replaying the same request returns its historical result; clients must not roll back newer revisions. Does not change system photos. Previously issued read URLs remain valid until their short expiry.
      parameters:
        - {$ref: '#/components/parameters/AssetID'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CloudAssetMutation'}
      responses:
        '200':
          description: Committed cloud state; trash revokes old shares and restoration never reopens them
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CloudAssetState'}
        default: {$ref: '#/components/responses/Error'}
  /v1/albums/library/assets/{assetID}/restore:
    post:
      operationId: restoreAlbumCloudAsset
      description: Applies to all historical versions. Requires the observed logical revision and a fresh request ID for new intent. Replaying the same request returns its historical result; clients must not roll back newer revisions. Does not change system photos. Previously issued read URLs remain valid until their short expiry.
      parameters:
        - {$ref: '#/components/parameters/AssetID'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CloudAssetMutation'}
      responses:
        '200':
          description: Committed cloud state; trash revokes old shares and restoration never reopens them
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CloudAssetState'}
        default: {$ref: '#/components/responses/Error'}
  /v1/albums/library/versions:
    get:
      operationId: listAlbumAssetVersions
      parameters:
        - in: query
          name: after
          schema: {type: integer, format: int64, minimum: 0}
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 100}
      responses:
        '200':
          description: Immutable verified versions in owner-serialized publication order, not current gallery items
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AssetVersionPage'}
        default: {$ref: '#/components/responses/Error'}
  /v1/albums/library/versions/{versionID}:
    get:
      operationId: getAlbumAssetVersion
      parameters:
        - in: path
          name: versionID
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Account-scoped verified version without provider object locations
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AssetVersion'}
        default: {$ref: '#/components/responses/Error'}
  /v1/albums/library/versions/{versionID}/resources/{resourceID}/read-grant:
    post:
      operationId: authorizeAlbumOriginalRead
      parameters:
        - {name: versionID, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/ResourceID'}
      responses:
        '200':
          description: Five-minute account-owned GET grant pinned to an immutable verified object version; not a public share link
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OriginalReadGrant'}
        default: {$ref: '#/components/responses/Error'}
  /v1/albums/library/versions/{versionID}/photo-previews/{preset}/read-grant:
    post:
      operationId: authorizeAlbumPhotoPreviewRead
      parameters:
        - {name: versionID, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: preset, in: path, required: true, schema: {$ref: '#/components/schemas/PhotoPreset'}}
      responses:
        '200':
          description: Five-minute owned immutable still-preview GET; does not authorize replacement or deletion, and does not include a Live Photo paired video
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PhotoPreviewReadGrant'}
        default: {$ref: '#/components/responses/Error'}
  /v1/albums/library/versions/{versionID}/video-previews/{preset}/read-grant:
    post:
      operationId: authorizeAlbumVideoPreviewRead
      parameters:
        - {name: versionID, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: preset, in: path, required: true, schema: {$ref: '#/components/schemas/VideoPreset'}}
      responses:
        '200':
          description: Five-minute owned immutable MP4 GET after asynchronous completion and quota commit; native decoding and system import are still required
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VideoPreviewReadGrant'}
        default: {$ref: '#/components/responses/Error'}
  /v1/albums/library/versions/{versionID}/live-previews/daily/read-grant:
    post:
      operationId: authorizeAlbumLivePhotoPreviewRead
      parameters:
        - {name: versionID, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Owned immutable JPEG and MP4 components with digest-bound source timing; requires native pairing and system readback and does not authorize replacement
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LivePhotoPreviewReadGrant'}
        default: {$ref: '#/components/responses/Error'}
  /v1/albums/library/versions/{versionID}/live-pair:
    get:
      operationId: getAlbumLivePair
      parameters:
        - {name: versionID, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Durable finished-pair upload state without object locations or signed URLs
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LivePairUpload'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createAlbumLivePair
      parameters:
        - {name: versionID, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [requestID, descriptor]
              properties:
                requestID: {type: string, format: uuid}
                descriptor: {$ref: '#/components/schemas/LivePairDescriptor'}
      responses:
        '201':
          description: Reserved pair intent or the already verified canonical pair; declarations alone do not publish a receipt
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LivePairUpload'}
        default: {$ref: '#/components/responses/Error'}
  /v1/albums/live-pair-uploads/{pairUploadID}/resource-grants:
    post:
      operationId: authorizeAlbumLivePairUpload
      parameters:
        - {name: pairUploadID, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Ten-minute size and content-type constrained JPEG and MOV staging PUTs, never archive writes
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [grants]
                properties:
                  grants: {type: array, minItems: 2, maxItems: 2, items: {$ref: '#/components/schemas/Grant'}}
        default: {$ref: '#/components/responses/Error'}
  /v1/albums/live-pair-uploads/{pairUploadID}/submit:
    post:
      operationId: submitAlbumLivePair
      parameters:
        - {name: pairUploadID, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '202':
          description: Queued server verification, never accepts client proof or a source-deletion certificate
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LivePairUpload'}
        default: {$ref: '#/components/responses/Error'}
  /v1/albums/library/versions/{versionID}/live-pair/read-grant:
    post:
      operationId: authorizeAlbumLivePairRead
      parameters:
        - {name: versionID, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Five-minute private GETs pinned to fully byte-verified JPEG and MOV versions; native semantic validation is still required
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LivePairReadGrant'}
        default: {$ref: '#/components/responses/Error'}
  /v1/albums/uploads:
    post:
      operationId: createAlbumUpload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [requestID, manifest]
              properties:
                requestID: {type: string, format: uuid}
                manifest: {$ref: '#/components/schemas/Manifest'}
      responses:
        '201':
          description: Reserved or idempotently replayed upload
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Upload'}
        default: {$ref: '#/components/responses/Error'}
  /v1/albums/uploads/{id}:
    parameters:
      - {$ref: '#/components/parameters/UploadID'}
    get:
      operationId: getAlbumUpload
      responses:
        '200':
          description: Upload belonging to the authenticated account
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Upload'}
        default: {$ref: '#/components/responses/Error'}
  /v1/albums/uploads/{id}/grants:
    parameters:
      - {$ref: '#/components/parameters/UploadID'}
    post:
      operationId: authorizeAlbumUploadResources
      description: Empty body. Grants cover only the manifest's exact staging objects, never archived originals.
      responses:
        '200':
          description: Short-lived staging write grants
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [grants]
                properties:
                  grants:
                    type: array
                    items: {$ref: '#/components/schemas/Grant'}
        default: {$ref: '#/components/responses/Error'}
  /v1/albums/uploads/{id}/submit:
    parameters:
      - {$ref: '#/components/parameters/UploadID'}
    post:
      operationId: submitAlbumUpload
      description: Empty body. Queues verification; client receipts and hashes are not verification evidence.
      responses:
        '202':
          description: Durable verification job queued or previously submitted state returned
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Upload'}
        default: {$ref: '#/components/responses/Error'}
  /v1/albums/uploads/{id}/resources/{resourceID}/multipart:
    parameters:
      - {$ref: '#/components/parameters/UploadID'}
      - {$ref: '#/components/parameters/ResourceID'}
    post:
      operationId: initializeAlbumMultipart
      responses:
        '200':
          description: Account-owned multipart state; assembled is not verified backup
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MultipartSession'}
        default: {$ref: '#/components/responses/Error'}
    get:
      operationId: getAlbumMultipart
      responses:
        '200':
          description: Account-owned multipart state; assembled is not verified backup
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MultipartStatus'}
        default: {$ref: '#/components/responses/Error'}
  /v1/albums/uploads/{id}/resources/{resourceID}/multipart/parts/{partNumber}/grant:
    parameters:
      - {$ref: '#/components/parameters/UploadID'}
      - {$ref: '#/components/parameters/ResourceID'}
      - {name: partNumber, in: path, required: true, schema: {type: integer, minimum: 1, maximum: 10000}}
    post:
      operationId: authorizeAlbumMultipartPart
      responses:
        '200':
          description: Account-owned multipart state; assembled is not verified backup
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MultipartPartGrant'}
        default: {$ref: '#/components/responses/Error'}
  /v1/albums/uploads/{id}/resources/{resourceID}/multipart/complete:
    parameters:
      - {$ref: '#/components/parameters/UploadID'}
      - {$ref: '#/components/parameters/ResourceID'}
    post:
      operationId: completeAlbumMultipart
      responses:
        '200':
          description: Account-owned multipart state; assembled is not verified backup
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MultipartAssembly'}
        default: {$ref: '#/components/responses/Error'}
  /v1/albums/live-pair-uploads/{pairUploadID}/resources/{resourceID}/multipart:
    parameters:
      - {name: pairUploadID, in: path, required: true, schema: {type: string, format: uuid}}
      - {$ref: '#/components/parameters/ResourceID'}
    post:
      operationId: initializeAlbumLivePairMultipart
      responses:
        '200':
          description: Owned Live Photo component session; assembled is not a verified pair or deletion permission
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MultipartSession'}
        default: {$ref: '#/components/responses/Error'}
    get:
      operationId: getAlbumLivePairMultipart
      responses:
        '200':
          description: Owned Live Photo component session; assembled is not a verified pair or deletion permission
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MultipartStatus'}
        default: {$ref: '#/components/responses/Error'}
  /v1/albums/live-pair-uploads/{pairUploadID}/resources/{resourceID}/multipart/parts/{partNumber}/grant:
    parameters:
      - {name: pairUploadID, in: path, required: true, schema: {type: string, format: uuid}}
      - {$ref: '#/components/parameters/ResourceID'}
      - {name: partNumber, in: path, required: true, schema: {type: integer, minimum: 1, maximum: 10000}}
    post:
      operationId: authorizeAlbumLivePairMultipartPart
      responses:
        '200':
          description: Owned Live Photo component session; assembled is not a verified pair or deletion permission
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MultipartPartGrant'}
        default: {$ref: '#/components/responses/Error'}
  /v1/albums/live-pair-uploads/{pairUploadID}/resources/{resourceID}/multipart/complete:
    parameters:
      - {name: pairUploadID, in: path, required: true, schema: {type: string, format: uuid}}
      - {$ref: '#/components/parameters/ResourceID'}
    post:
      operationId: completeAlbumLivePairMultipart
      responses:
        '200':
          description: Owned Live Photo component session; assembled is not a verified pair or deletion permission
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MultipartAssembly'}
        default: {$ref: '#/components/responses/Error'}
  /v1/albums/library/versions/{versionID}/share-links:
    parameters:
      - {name: versionID, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: listAlbumShareLinks
      responses:
        '200':
          description: Up to 32 currently active owner-managed links for this verified version
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [links]
                properties:
                  links: {type: array, maxItems: 32, items: {$ref: '#/components/schemas/ShareLink'}}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createAlbumShareLink
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ShareCreateRequest'}
      responses:
        '201':
          description: Idempotent owner-scoped link; password and raw secret are not stored
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ShareLink'}
        default: {$ref: '#/components/responses/Error'}
  /v1/albums/share-links/{shareID}:
    delete:
      operationId: revokeAlbumShareLink
      parameters:
        - {name: shareID, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204': {description: New claims and grant renewals stopped; already issued URLs remain bounded by five minutes}
        default: {$ref: '#/components/responses/Error'}
  /v1/albums/share-links/lookup:
    post:
      operationId: lookupAlbumShareLink
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ShareTokenRequest'}
      responses:
        '200':
          description: Limited metadata for a secret-authenticated active link; no count consumed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ShareLookup'}
        default: {$ref: '#/components/responses/Error'}
  /v1/albums/share-links/claims:
    post:
      operationId: claimAlbumShareLink
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ShareClaimRequest'}
      responses:
        '200':
          description: At most one-hour idempotent authorization; one claim covers every verified original resource
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ShareClaim'}
        default: {$ref: '#/components/responses/Error'}
  /v1/albums/share-links/read-grants:
    post:
      operationId: authorizeAlbumSharedReads
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ShareTokenRequest'}
      responses:
        '200':
          description: Claim-authenticated version-pinned attachment GET URLs; refreshing consumes no extra claim
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [resources]
                properties:
                  resources: {type: array, minItems: 1, maxItems: 32, items: {$ref: '#/components/schemas/SharedReadGrant'}}
        default: {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    AlbumAccount:
      type: http
      scheme: bearer
      description: Verified stable account authentication scoped to the albums application. App Attest alone is insufficient.
  parameters:
    AssetID:
      name: assetID
      in: path
      required: true
      schema: {type: string, pattern: '^[A-Za-z0-9_-]{1,96}$'}
    ResourceID:
      name: resourceID
      in: path
      required: true
      schema: {type: string, pattern: '^[A-Za-z0-9_-]{1,96}$'}
    UploadID:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
  responses:
    Error:
      description: Authentication, scope, quota, state or service error. Internal provider details are not returned.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [code]
            properties:
              code: {type: string}
  schemas:
    PushRegistration:
      type: object
      additionalProperties: false
      required: [revision, state]
      properties:
        registrationID: {type: string, format: uuid}
        revision: {type: integer, format: int64, minimum: 0}
