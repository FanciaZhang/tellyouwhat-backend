name: Backend CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deployment:
        description: Deployment acceptance stage
        required: true
        default: none
        type: choice
        options:
          - none
          - internal
          - public

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_PREFIX: ghcr.io/fanciazhang/tellyouwhat-ai

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: tellyouwhat_test
          MYSQL_USER: tellyouwhat_test
          MYSQL_PASSWORD: ci-test-password
          MYSQL_ROOT_PASSWORD: ci-test-root-password
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:8-alpine
        ports:
          - 6379/tcp
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Test with MySQL and Redis
        run: |
          test -n "$MYSQL_TEST_DSN"
          test -n "$REDIS_TEST_URL"
          go test -count=1 -v ./...
        env:
          MYSQL_TEST_DSN: tellyouwhat_test:ci-test-password@tcp(127.0.0.1:${{ job.services.mysql.ports['3306'] }})/tellyouwhat_test?charset=utf8mb4&collation=utf8mb4_0900_ai_ci
          REDIS_TEST_URL: redis://127.0.0.1:${{ job.services.redis.ports['6379'] }}/0
      - run: go vet ./...
      - run: go build ./cmd/...
      - run: make verify-generated
      - run: swift test --package-path Contracts/HTTP
      - run: bash deploy/tencent/deploy-production_test.sh
      - run: bash deploy/tencent/verify-public_test.sh
      - name: Validate deployment files
        run: |
          touch .env.production
          docker compose -f compose.production.yaml config --quiet
        env:
          HEALTH_API_DOMAIN: api.health.example
          JOURNAL_API_DOMAIN: api.journal.example
          ADMIN_DOMAIN: admin.example
          ACME_EMAIL: ops@example.com
          MYSQL_USER: app
          MYSQL_PASSWORD: placeholder
          MYSQL_DATABASE: app
          REDIS_PASSWORD: placeholder
      - name: Validate Caddy configuration
        run: >-
          docker run --rm --entrypoint caddy
          -e HEALTH_API_DOMAIN=api.health.example
          -e JOURNAL_API_DOMAIN=api.journal.example
          -e ADMIN_DOMAIN=admin.example
          -e ACME_EMAIL=ops@example.com
          -v "${{ github.workspace }}/deploy/single-server/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2-alpine
          validate --config /etc/caddy/Caddyfile

  container:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, worker, admin, adminctl, migrate, maintenance]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:main
          build-args: SERVICE=${{ matrix.service }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    needs: container
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && vars.PRODUCTION_DEPLOY_ENABLED == 'true') ||
       (github.event_name == 'workflow_dispatch' && inputs.deployment != 'none'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: backend-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Materialize protected deployment inputs
        env:
          PRODUCTION_ENV_FILE: ${{ secrets.PRODUCTION_ENV_FILE }}
          HEALTH_SUBSCRIPTION_KEY: ${{ secrets.HEALTH_APP_STORE_PRIVATE_KEY }}
          JOURNAL_SUBSCRIPTION_KEY: ${{ secrets.JOURNAL_APP_STORE_PRIVATE_KEY }}
          HEALTH_MARKETING_KEY: ${{ secrets.HEALTH_APP_STORE_CONNECT_PRIVATE_KEY }}
          JOURNAL_MARKETING_KEY: ${{ secrets.JOURNAL_APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          install -d -m 700 "$RUNNER_TEMP/tellyouwhat-secrets"
          printf '%s\n' "$PRODUCTION_ENV_FILE" > "$RUNNER_TEMP/.env.production"
          printf '%s\n' "$HEALTH_SUBSCRIPTION_KEY" > "$RUNNER_TEMP/tellyouwhat-secrets/health-subscription.p8"
          printf '%s\n' "$JOURNAL_SUBSCRIPTION_KEY" > "$RUNNER_TEMP/tellyouwhat-secrets/journal-subscription.p8"
          printf '%s\n' "$HEALTH_MARKETING_KEY" > "$RUNNER_TEMP/tellyouwhat-secrets/health-marketing.p8"
          printf '%s\n' "$JOURNAL_MARKETING_KEY" > "$RUNNER_TEMP/tellyouwhat-secrets/journal-marketing.p8"
          chmod 600 "$RUNNER_TEMP/.env.production" "$RUNNER_TEMP"/tellyouwhat-secrets/*.p8
          grep -q '^HEALTH_API_DOMAIN=' "$RUNNER_TEMP/.env.production"
          grep -q '^JOURNAL_API_DOMAIN=' "$RUNNER_TEMP/.env.production"
          grep -q '^ADMIN_DOMAIN=' "$RUNNER_TEMP/.env.production"
          for key in "$RUNNER_TEMP"/tellyouwhat-secrets/*.p8; do openssl pkey -in "$key" -noout; done
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/tellyouwhat-production
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/tellyouwhat-production
      - name: Upload deployment files
        env:
          DEPLOY_HOST: ${{ vars.PRODUCTION_HOST }}
          DEPLOY_USER: ${{ vars.PRODUCTION_USER }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          remote_stage="/opt/tellyouwhat/backend/.incoming-${GITHUB_SHA}"
          ssh -i ~/.ssh/tellyouwhat-production -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" "install -d -m 700 '$remote_stage/secrets' '$remote_stage/deploy/single-server' '$remote_stage/deploy/tencent'"
          scp -i ~/.ssh/tellyouwhat-production -o IdentitiesOnly=yes compose.production.yaml "$DEPLOY_USER@$DEPLOY_HOST:$remote_stage/compose.production.yaml"
          scp -i ~/.ssh/tellyouwhat-production -o IdentitiesOnly=yes deploy/single-server/Caddyfile "$DEPLOY_USER@$DEPLOY_HOST:$remote_stage/deploy/single-server/Caddyfile"
          scp -i ~/.ssh/tellyouwhat-production -o IdentitiesOnly=yes deploy/tencent/deploy-production.sh deploy/tencent/readiness.sh "$DEPLOY_USER@$DEPLOY_HOST:$remote_stage/deploy/tencent/"
          scp -i ~/.ssh/tellyouwhat-production -o IdentitiesOnly=yes "$RUNNER_TEMP/.env.production" "$DEPLOY_USER@$DEPLOY_HOST:$remote_stage/.env.production"
          scp -i ~/.ssh/tellyouwhat-production -o IdentitiesOnly=yes "$RUNNER_TEMP"/tellyouwhat-secrets/*.p8 "$DEPLOY_USER@$DEPLOY_HOST:$remote_stage/secrets/"
          ssh -i ~/.ssh/tellyouwhat-production -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- "$remote_stage" <<'REMOTE'
          set -euo pipefail
          stage="$1"
          backend_dir=/opt/tellyouwhat/backend
          install -d -m 750 "$backend_dir/secrets"
          install -d -m 755 "$backend_dir/deploy/single-server" "$backend_dir/deploy/tencent"
          install -m 644 "$stage/compose.production.yaml" "$backend_dir/compose.production.yaml"
          install -m 644 "$stage/deploy/single-server/Caddyfile" "$backend_dir/deploy/single-server/Caddyfile"
          install -m 755 "$stage/deploy/tencent/"*.sh "$backend_dir/deploy/tencent/"
          install -m 600 "$stage/.env.production" "$backend_dir/.env.production"
          install -m 640 "$stage/secrets/"*.p8 "$backend_dir/secrets/"
          sudo -n chgrp 65532 "$backend_dir/secrets" "$backend_dir/secrets/"*.p8
          rm -rf -- "$stage"
          REMOTE
      - name: Deploy and verify internal services
        env:
          DEPLOY_HOST: ${{ vars.PRODUCTION_HOST }}
          DEPLOY_USER: ${{ vars.PRODUCTION_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOYMENT_MODE: ${{ github.event_name == 'push' && 'public' || inputs.deployment }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/tellyouwhat-production -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          ssh -i ~/.ssh/tellyouwhat-production -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" /opt/tellyouwhat/backend/deploy/tencent/deploy-production.sh "${GITHUB_SHA}" "${IMAGE_PREFIX}" "$DEPLOYMENT_MODE"
          printf 'Internal services verified for `%s`. Requested stage: `%s`.\n' "$GITHUB_SHA" "$DEPLOYMENT_MODE" >> "$GITHUB_STEP_SUMMARY"

  verify-public:
    needs: deploy
    if: >-
      needs.deploy.result == 'success' &&
      (github.event_name == 'push' || inputs.deployment == 'public')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Verify all public runtimes
        run: |
          bash deploy/tencent/verify-public.sh api.health.tellyouwhat.cn api.journal.tellyouwhat.cn admin.tellyouwhat.cn
          printf 'Public HTTPS verified for `%s` across Health, Journal, and admin.\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
