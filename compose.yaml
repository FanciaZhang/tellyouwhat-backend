services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: tellyouwhat
      MYSQL_USER: tellyouwhat
      MYSQL_PASSWORD: local-only-password
      MYSQL_ROOT_PASSWORD: local-only-root-password
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=local-only-password mysqladmin ping -h 127.0.0.1 -u tellyouwhat --silent"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - tellyouwhat-mysql:/var/lib/mysql

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - tellyouwhat-redis:/data

volumes:
  tellyouwhat-mysql:
  tellyouwhat-redis:
