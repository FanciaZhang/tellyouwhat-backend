openapi: 3.1.0
info:
  title: Tellyouwhat Platform API
  version: 1.0.0
  description: >-
    Canonical HTTP contract for authentication, commerce, privacy, quota, and
    service capabilities shared by every Tellyouwhat App.
servers: []
tags:
- name: Platform
- name: Service
- name: Products
- name: Attestation
- name: Entitlements
- name: Privacy
- name: AI
- name: Apple
paths:
  "/healthz":
    get:
      operationId: getHealth
      tags:
      - Platform
      - Service
      summary: Process health check
      security: []
      responses:
        '200':
          description: The process is running.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ServiceStatus"
        default:
          "$ref": "#/components/responses/Error"
  "/readyz":
    get:
      operationId: getReadiness
      tags:
      - Platform
      - Service
      summary: Dependency readiness check
      security: []
      responses:
        '200':
          description: All required dependencies are ready.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ServiceStatus"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
        default:
          "$ref": "#/components/responses/Error"
  "/v1/ai/quota":
    get:
      operationId: getAIQuota
      tags:
      - Platform
      - AI
      summary: Read the current managed-AI quota snapshot
      security:
      - AppAttestKeyID: []
        AppAttestAssertion: []
        AppAttestNonce: []
        AppAttestTimestamp: []
        AppAttestRequestID: []
      parameters:
      - "$ref": "#/components/parameters/RequestIDHeader"
      - name: businessDayStartHour
        in: query
        required: false
        description: Optional local business-day boundary for capability counters.
        schema:
          type: integer
          minimum: 0
          maximum: 23
          default: 4
      - name: timeZoneIdentifier
        in: query
        required: false
        description: Optional IANA time zone for capability counters.
        schema:
          type: string
          minLength: 1
          maxLength: 64
          default: Asia/Shanghai
      responses:
        '200':
          description: Token usage and any App-specific capability counters.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/QuotaSnapshot"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '409':
          "$ref": "#/components/responses/Conflict"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
        default:
          "$ref": "#/components/responses/Error"
  "/v1/app-store/notifications":
    post:
      operationId: processAppStoreNotification
      tags:
      - Platform
      - Apple
      summary: Receive an App Store Server Notification V2
      description: Apple JWS verification replaces App Attest on this route.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/AppStoreNotificationRequest"
      responses:
        '200':
          description: The notification was durably processed or was already processed.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OKStatus"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '404':
          "$ref": "#/components/responses/NotFound"
        '413':
          "$ref": "#/components/responses/PayloadTooLarge"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
        default:
          "$ref": "#/components/responses/Error"
  "/v1/attest/challenges":
    post:
      operationId: issueAttestationChallenge
      tags:
      - Platform
      - Attestation
      summary: Issue a one-time App Attest challenge
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/AttestationChallengeRequest"
      responses:
        '201':
          description: A one-time challenge was issued.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AttestationChallenge"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '422':
          "$ref": "#/components/responses/UnprocessableEntity"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
        default:
          "$ref": "#/components/responses/Error"
  "/v1/attest/keys":
    post:
      operationId: registerAttestationKey
      tags:
      - Platform
      - Attestation
      summary: Register an App Attest key
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/AttestationRegistrationRequest"
      responses:
        '201':
          description: The App Attest key was registered.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AttestationRegistrationResponse"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '409':
          "$ref": "#/components/responses/Conflict"
        '413':
          "$ref": "#/components/responses/PayloadTooLarge"
        '422':
          "$ref": "#/components/responses/UnprocessableEntity"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
        default:
          "$ref": "#/components/responses/Error"
  "/v1/dev/entitlements/activate":
    post:
      operationId: activateDevelopmentEntitlement
      tags:
      - Platform
      - Entitlements
      summary: Activate a development-only managed entitlement
      description: The handler returns 404 when the production dependency set is active.
      security:
      - AppAttestKeyID: []
        AppAttestAssertion: []
        AppAttestNonce: []
        AppAttestTimestamp: []
        AppAttestRequestID: []
        DevelopmentActivation: []
      parameters:
      - "$ref": "#/components/parameters/RequestIDHeader"
      - "$ref": "#/components/parameters/DevelopmentActivationHeader"
      responses:
        '200':
          description: The development entitlement is active.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EntitlementStatus"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
        default:
          "$ref": "#/components/responses/Error"
  "/v1/entitlements/transactions":
    post:
      operationId: synchronizeSubscriptionTransaction
      tags:
      - Platform
      - Entitlements
      summary: Synchronize a locally verified StoreKit transaction
      security:
      - AppAttestKeyID: []
        AppAttestAssertion: []
        AppAttestNonce: []
        AppAttestTimestamp: []
        AppAttestRequestID: []
      parameters:
      - "$ref": "#/components/parameters/RequestIDHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/SubscriptionTransactionRequest"
      responses:
        '200':
          description: The current managed subscription was confirmed.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EntitlementStatus"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '413':
          "$ref": "#/components/responses/PayloadTooLarge"
        '422':
          "$ref": "#/components/responses/UnprocessableEntity"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
        default:
          "$ref": "#/components/responses/Error"
  "/v1/privacy/consents":
    post:
      operationId: recordPrivacyConsents
      tags:
      - Platform
      - Privacy
      summary: Record the current privacy consent versions
      security:
      - AppAttestKeyID: []
        AppAttestAssertion: []
        AppAttestNonce: []
        AppAttestTimestamp: []
        AppAttestRequestID: []
      parameters:
      - "$ref": "#/components/parameters/RequestIDHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PrivacyConsentRequest"
      responses:
        '200':
          description: The consent records were stored.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PrivacyConsentResponse"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '409':
          "$ref": "#/components/responses/Conflict"
        '413':
          "$ref": "#/components/responses/PayloadTooLarge"
        '422':
          "$ref": "#/components/responses/UnprocessableEntity"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
        default:
          "$ref": "#/components/responses/Error"
  "/v1/privacy/data":
    delete:
      operationId: deletePrivacyData
      tags:
      - Platform
      - Privacy
      summary: Delete all managed service data for the caller
      security:
      - AppAttestKeyID: []
        AppAttestAssertion: []
        AppAttestNonce: []
        AppAttestTimestamp: []
        AppAttestRequestID: []
      parameters:
      - "$ref": "#/components/parameters/RequestIDHeader"
      responses:
        '204':
          description: All data was deleted.
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '409':
          "$ref": "#/components/responses/Conflict"
        '413':
          "$ref": "#/components/responses/PayloadTooLarge"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
        default:
          "$ref": "#/components/responses/Error"
  "/v1/products/managed-ai":
    get:
      operationId: getManagedAIProduct
      tags:
      - Platform
      - Products
      summary: Describe the managed-AI subscription product
      security: []
      responses:
        '200':
          description: Public product and policy metadata.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ManagedAIProduct"
        default:
          "$ref": "#/components/responses/Error"
components:
  parameters:
    DevelopmentActivationHeader:
      in: header
      name: X-Tellyouwhat-Dev-Activation
      required: true
      schema:
        type: string
        minLength: 1
    RequestIDHeader:
      in: header
      name: X-Tellyouwhat-Request-ID
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: The request envelope is malformed.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    Conflict:
      description: A replay, idempotency, or state conflict occurred.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    Error:
      description: An error response.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The caller is authenticated but lacks the required entitlement.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    NotFound:
      description: The route or resource does not exist for this caller.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    PayloadTooLarge:
      description: The request exceeds an operation-specific size limit.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: A required service dependency is unavailable.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication or one-time capability validation failed.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    UnprocessableEntity:
      description: The request violates the managed business contract.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
  schemas:
    AppStoreNotificationRequest:
      type: object
      additionalProperties: false
      required:
      - signedPayload
      properties:
        signedPayload:
          type: string
          minLength: 1
    AttestationChallenge:
      type: object
      additionalProperties: false
      required:
      - challenge
      - expiresAt
      properties:
        challenge:
          type: string
          minLength: 1
        expiresAt:
          type: string
          format: date-time
    AttestationChallengeRequest:
      type: object
      additionalProperties: false
      required:
      - keyID
      properties:
        keyID:
          type: string
          minLength: 1
          maxLength: 512
    AttestationRegistrationRequest:
      type: object
      additionalProperties: false
      required:
      - keyID
      - challenge
      - attestation
      - build
      - activationSecret
      properties:
        keyID:
          type: string
          minLength: 1
          maxLength: 512
        challenge:
          type: string
          minLength: 1
        attestation:
          type: string
          minLength: 1
          contentEncoding: base64
        build:
          type: string
        activationSecret:
          type: string
    AttestationRegistrationResponse:
      type: object
      additionalProperties: false
      required:
      - keyID
      - deviceID
      properties:
        keyID:
          type: string
        deviceID:
          type: string
          format: uuid
    EntitlementStatus:
      type: object
      additionalProperties: false
      required:
      - status
      - expiresAt
      properties:
        status:
          type: string
          const: active
        expiresAt:
          type: string
          format: date-time
    ErrorDetail:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      - requestID
      properties:
        code:
          type: string
        message:
          type: string
        requestID:
          type: string
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
      - error
      properties:
        error:
          "$ref": "#/components/schemas/ErrorDetail"
    ManagedAIProduct:
      type: object
      additionalProperties: false
      required:
      - productID
      - billingPeriod
      - dailyTokenLimit
      - monthlyTokenLimit
      - provider
      - modelDisclosure
      - mediaRetention
      - jobRetention
      - privacyURL
      - termsURL
      - privacyChoicesURL
      - supportURL
      properties:
        productID:
          type: string
        billingPeriod:
          type: string
          example: P1M
        dailyTokenLimit:
          type: integer
          minimum: 0
        monthlyTokenLimit:
          type: integer
          minimum: 0
        provider:
          type: string
        modelDisclosure:
          type: string
        mediaRetention:
          type: string
        jobRetention:
          type: string
        privacyURL:
          type: string
          format: uri
        termsURL:
          type: string
          format: uri
        privacyChoicesURL:
          type: string
          format: uri
        supportURL:
          type: string
          format: uri
    OKStatus:
      type: object
      additionalProperties: false
      required:
      - status
      properties:
        status:
          type: string
          const: ok
    PrivacyConsent:
      type: object
      additionalProperties: false
      required:
      - scope
      - documentVersion
      - granted
      properties:
        scope:
          type: string
          enum:
          - adult
          - privacy_and_terms
          - lifetime_byok
          - managed_subscription
          - free_managed_recognition
          - sensitive_health_ai
        documentVersion:
          type: string
          minLength: 1
          maxLength: 32
        granted:
          type: boolean
    PrivacyConsentRequest:
      type: object
      additionalProperties: false
      required:
      - consents
      properties:
        consents:
          type: array
          minItems: 1
          maxItems: 6
          items:
            "$ref": "#/components/schemas/PrivacyConsent"
    PrivacyConsentResponse:
      type: object
      additionalProperties: false
      required:
      - recordedAt
      - count
      properties:
        recordedAt:
          type: string
          format: date-time
        count:
          type: integer
          minimum: 1
          maximum: 6
    QuotaSnapshot:
      type: object
      additionalProperties: false
      required:
      - plan
      - dailyUsed
      - dailyLimit
      - dailyResetAt
      - monthlyUsed
      - monthlyLimit
      - monthlyResetAt
      properties:
        plan:
          type: string
          enum:
          - free
          - managed_subscription
        dailyUsed:
          type: integer
          minimum: 0
        dailyLimit:
          type: integer
          minimum: 0
        dailyResetAt:
          type: string
          format: date-time
        monthlyUsed:
          type: integer
          minimum: 0
        monthlyLimit:
          type: integer
          minimum: 0
        monthlyResetAt:
          type: string
          format: date-time
        recognition:
          description: Optional free-recognition capability quota exposed by Health.
          "$ref": "#/components/schemas/RecognitionQuotaSnapshot"
    RecognitionQuotaSnapshot:
      type: object
      additionalProperties: false
      required:
      - completed
      - reserved
      - remaining
      - resetAt
      properties:
        completed:
          type: integer
          minimum: 0
        reserved:
          type: integer
          minimum: 0
        remaining:
          type: integer
          minimum: 0
        resetAt:
          type: string
          format: date-time
    ServiceStatus:
      type: object
      additionalProperties: false
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - ok
          - ready
    SubscriptionTransactionRequest:
      type: object
      additionalProperties: false
      required:
      - signedTransaction
      properties:
        signedTransaction:
          type: string
          minLength: 1
  securitySchemes:
    AppAttestKeyID:
      type: apiKey
      in: header
      name: X-Tellyouwhat-Key-ID
      description: Registered App Attest key identifier.
    AppAttestAssertion:
      type: apiKey
      in: header
      name: X-Tellyouwhat-Assertion
      description: Base64-encoded App Attest assertion for the canonical request binding.
    AppAttestNonce:
      type: apiKey
      in: header
      name: X-Tellyouwhat-Nonce
      description: One-time challenge value.
    AppAttestTimestamp:
      type: apiKey
      in: header
      name: X-Tellyouwhat-Timestamp
      description: RFC 3339 assertion timestamp.
    AppAttestRequestID:
      type: apiKey
      in: header
      name: X-Tellyouwhat-Request-ID
      description: Lowercase UUID bound into the assertion.
    DevelopmentActivation:
      type: apiKey
      in: header
      name: X-Tellyouwhat-Dev-Activation
