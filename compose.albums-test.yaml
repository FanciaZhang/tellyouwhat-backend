# Independent stack: never include this as an override of compose.production.yaml.
name: tellyouwhat-albums-test

x-album-app: &album-app
  restart: unless-stopped
  init: true
  user: "65532:65532"
  read_only: true
  security_opt: [no-new-privileges:true]
  env_file: ["${ALBUM_TEST_ENV_FILE:?Set the private album test environment file}"]
  environment: &album-environment
    ALBUM_DEPLOYMENT_ENVIRONMENT: test
    ALBUM_DATABASE_DSN: "${ALBUM_TEST_MYSQL_USER:-albums_test}:${ALBUM_TEST_MYSQL_PASSWORD:?Set a test-only database password}@tcp(mysql:3306)/albums_test?charset=utf8mb4&collation=utf8mb4_0900_ai_ci"
    ALBUM_REDIS_URL: "redis://:${ALBUM_TEST_REDIS_PASSWORD:?Set a test-only URL-safe Redis password}@redis:6379/0"
  networks: [albums-test]
  logging:
    driver: json-file
    options: {max-size: 5m, max-file: "2"}

services:
  albumgateway:
    <<: *album-app
    image: "${ALBUM_TEST_IMAGE_PREFIX:-tellyouwhat-albums-test}-albumgateway:${ALBUM_TEST_IMAGE_TAG:?Set the exact tested Git commit}"
    build:
      context: .
      args: {SERVICE: albumgateway}
    environment:
      <<: *album-environment
      ALBUM_HTTP_LISTEN_ADDRESS: "0.0.0.0:8080"
      ALBUM_TRUSTED_PROXIES: "${ALBUM_TEST_PROXY_CIDR:-172.29.90.1/32}"
    volumes:
      - "${ALBUM_TEST_SECRET_DIRECTORY:?Set the private test secret directory}:/album-secrets:ro"
    ports: ["127.0.0.1:${ALBUM_TEST_API_PORT:-18090}:8080/tcp"]
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, /service, -check-ready]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 20s
    mem_limit: 256m
    pids_limit: 100

  albumworker:
    <<: *album-app
    image: "${ALBUM_TEST_IMAGE_PREFIX:-tellyouwhat-albums-test}-albumworker:${ALBUM_TEST_IMAGE_TAG:?Set the exact tested Git commit}"
    build:
      context: .
      args: {SERVICE: albumworker}
    depends_on:
      mysql: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    stop_grace_period: 35s
    mem_limit: 384m
    pids_limit: 100

  migrate:
    <<: *album-app
    restart: "no"
    image: "${ALBUM_TEST_IMAGE_PREFIX:-tellyouwhat-albums-test}-migrate:${ALBUM_TEST_IMAGE_TAG:?Set the exact tested Git commit}"
    build:
      context: .
      args: {SERVICE: migrate}
    environment:
      DATABASE_DSN: "${ALBUM_TEST_MYSQL_USER:-albums_test}:${ALBUM_TEST_MYSQL_PASSWORD:?Set a test-only database password}@tcp(mysql:3306)/albums_test?charset=utf8mb4&collation=utf8mb4_0900_ai_ci"
    depends_on:
      mysql: {condition: service_healthy}
    mem_limit: 128m
    pids_limit: 50

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: albums_test
      MYSQL_USER: "${ALBUM_TEST_MYSQL_USER:-albums_test}"
      MYSQL_PASSWORD: "${ALBUM_TEST_MYSQL_PASSWORD:?Set a test-only database password}"
      MYSQL_ROOT_PASSWORD: "${ALBUM_TEST_MYSQL_ROOT_PASSWORD:?Set a different test-only root password}"
    command: [--performance-schema=OFF, --innodb-buffer-pool-size=134217728, --max-connections=30]
    volumes: [albums-test-mysql:/var/lib/mysql]
    networks: [albums-test]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, localhost, --silent]
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 512m
    pids_limit: 150
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: "${ALBUM_TEST_REDIS_PASSWORD:?Set a test-only URL-safe Redis password}"
    command: [sh, -ec, 'exec redis-server --requirepass "$${REDIS_PASSWORD}" --maxmemory 64mb --maxmemory-policy noeviction --appendonly no --save ""']
    networks: [albums-test]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -qx PONG']
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 96m
    pids_limit: 50
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}

networks:
  albums-test:
    ipam:
      config: [{subnet: "${ALBUM_TEST_NETWORK_CIDR:-172.29.90.0/24}"}]
volumes:
  albums-test-mysql:
