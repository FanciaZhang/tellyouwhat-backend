openapi: 3.1.0
info:
  title: Tellyouwhat Administration API
  version: 1.0.0
  description: Canonical contract for the Passkey-only administration service.
servers:
  - url: https://admin.tellyouwhat.cn
    description: Production
tags:
  - name: Service
  - name: Authentication
  - name: Security
  - name: Administration
  - name: Offers
security:
  - AdminSession: []
paths:
  /api/v1/ai/prompts:
    get:
      operationId: getPromptConfig
      tags: [Administration]
      parameters:
        - { name: scope, in: query, required: true, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/OK" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/ai/prompts/history:
    get:
      operationId: listPromptHistory
      tags: [Administration]
      parameters:
        - { name: scope, in: query, required: true, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string, minLength: 36, maxLength: 36 } }
      responses:
        "200": { $ref: "#/components/responses/OK" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/ai/prompts/revisions/{revision}:
    get:
      operationId: getPromptRevision
      tags: [Administration]
      parameters:
        - { name: revision, in: path, required: true, schema: { type: string, minLength: 36, maxLength: 36 } }
      responses:
        "200": { $ref: "#/components/responses/OK" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/ai/prompts/drafts:
    post:
      operationId: createPromptDraft
      tags: [Administration]
      parameters:
        - { $ref: "#/components/parameters/CSRFToken" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PromptDraft" }
      responses:
        "200": { $ref: "#/components/responses/OK" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/ai/prompts/publish:
    post:
      operationId: publishPromptConfig
      tags: [Administration]
      parameters:
        - { $ref: "#/components/parameters/CSRFToken" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PromptPublication" }
      responses:
        "200": { $ref: "#/components/responses/OK" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/platform/config:
    get:
      operationId: getOperationsConfig
      tags: [Administration]
      responses:
        "200": { $ref: "#/components/responses/OK" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/platform/metrics:
    get:
      operationId: getOperationsMetrics
      tags: [Administration]
      responses:
        "200": { $ref: "#/components/responses/OK" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/platform/config/history:
    get:
      operationId: listOperationsHistory
      tags: [Administration]
      parameters:
        - { name: cursor, in: query, schema: { type: string, minLength: 36, maxLength: 36 } }
      responses:
        "200": { $ref: "#/components/responses/OK" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/platform/config/revisions/{revision}:
    get:
      operationId: getOperationsRevision
      tags: [Administration]
      parameters:
        - { name: revision, in: path, required: true, schema: { type: string, minLength: 36, maxLength: 36 } }
      responses:
        "200": { $ref: "#/components/responses/OK" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/platform/config/drafts:
    post:
      operationId: createOperationsDraft
      tags: [Administration]
      parameters:
        - { $ref: "#/components/parameters/CSRFToken" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OperationsDraft" }
      responses:
        "200": { $ref: "#/components/responses/OK" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/platform/config/publish:
    post:
      operationId: publishOperationsConfig
      tags: [Administration]
      parameters:
        - { $ref: "#/components/parameters/CSRFToken" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OperationsPublication" }
      responses:
        "200": { $ref: "#/components/responses/OK" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/ai/rolling/preview:
    post:
      operationId: createAIRollingPreview
      tags: [Administration]
      parameters:
        - { $ref: "#/components/parameters/CSRFToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AIRollingInput" }
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "202": { $ref: "#/components/responses/OK" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/ai/rolling/commands:
    post:
      operationId: submitAIRollingCommand
      tags: [Administration]
      parameters:
        - { $ref: "#/components/parameters/CSRFToken" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AIRollingSubmission" }
      responses:
        "202": { $ref: "#/components/responses/OK" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/ai/health:
    get:
      operationId: getHealthAIConfig
      tags: [Administration]
      responses:
        "200": { $ref: "#/components/responses/OK" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/ai/models:
    get:
      operationId: listAIModels
      tags: [Administration]
      responses:
        "200": { $ref: "#/components/responses/OK" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/ai/health/drafts:
    post:
      operationId: createHealthAIDraft
      tags: [Administration]
      parameters:
        - { $ref: "#/components/parameters/CSRFToken" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HealthAIDraftRequest" }
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "202": { $ref: "#/components/responses/OK" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/ai/health/publish:
    post:
      operationId: publishHealthAIConfig
      tags: [Administration]
      parameters:
        - { $ref: "#/components/parameters/CSRFToken" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HealthAIPublishRequest" }
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "202": { $ref: "#/components/responses/OK" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/ai/health/{operation}/history:
    get:
      operationId: getHealthAIHistory
      tags: [Administration]
      parameters:
        - { name: operation, in: path, required: true, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 36 } }
      responses:
        "200": { $ref: "#/components/responses/OK" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/ai/health/{operation}/revisions/{revision}:
    get:
      operationId: getHealthAIRevision
      tags: [Administration]
      parameters:
        - { name: operation, in: path, required: true, schema: { type: string } }
        - { name: revision, in: path, required: true, schema: { type: string, maxLength: 36 } }
      responses:
        "200": { $ref: "#/components/responses/OK" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/ai/models/{model}/versions:
    get:
      operationId: listAIModelVersions
      tags: [Administration]
      parameters:
        - { name: model, in: path, required: true, schema: { type: string, maxLength: 128 } }
      responses:
        "200": { $ref: "#/components/responses/OK" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/ai/endpoints/{endpoint}:
    get:
      operationId: getAIEndpoint
      tags: [Administration]
      parameters:
        - { name: endpoint, in: path, required: true, schema: { type: string, maxLength: 128 } }
      responses:
        "200": { $ref: "#/components/responses/OK" }
        default: { $ref: "#/components/responses/Error" }
  /healthz:
    get:
      operationId: getAdminHealth
      tags: [Service]
      security: []
      responses:
        "200": { $ref: "#/components/responses/OK" }
        default: { $ref: "#/components/responses/Error" }
  /readyz:
    get:
      operationId: getAdminReadiness
      tags: [Service]
      security: []
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "503": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/auth/setup/options:
    post:
      operationId: beginSetup
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetupRequest" }
      responses:
        "200": { $ref: "#/components/responses/OK" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/auth/setup/finish:
    post:
      operationId: finishSetup
      tags: [Authentication]
      security: []
      parameters:
        - { $ref: "#/components/parameters/CeremonyID" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebAuthnCredential" }
      responses:
        "201": { $ref: "#/components/responses/Created" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/auth/login/options:
    post:
      operationId: beginLogin
      tags: [Authentication]
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmptyObject" }
      responses:
        "200": { $ref: "#/components/responses/OK" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/auth/login/finish:
    post:
      operationId: finishLogin
      tags: [Authentication]
      security: []
      parameters:
        - { $ref: "#/components/parameters/CeremonyID" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebAuthnCredential" }
      responses:
        "200": { $ref: "#/components/responses/OK" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/auth/enroll/options:
    post:
      operationId: beginEnrollment
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnrollmentRequest" }
      responses:
        "200": { $ref: "#/components/responses/OK" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/auth/enroll/finish:
    post:
      operationId: finishEnrollment
      tags: [Authentication]
      security: []
      parameters:
        - { $ref: "#/components/parameters/CeremonyID" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebAuthnCredential" }
      responses:
        "201": { $ref: "#/components/responses/Created" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [Authentication]
      parameters:
        - { $ref: "#/components/parameters/Origin" }
        - { $ref: "#/components/parameters/CSRFToken" }
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/session:
    get:
      operationId: getSession
      tags: [Authentication]
      responses:
        "200": { $ref: "#/components/responses/OK" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/auth/reauth/options:
    post:
      operationId: beginReauthentication
      tags: [Authentication]
      parameters:
        - { $ref: "#/components/parameters/Origin" }
        - { $ref: "#/components/parameters/CSRFToken" }
      responses:
        "200": { $ref: "#/components/responses/OK" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/auth/reauth/finish:
    post:
      operationId: finishReauthentication
      tags: [Authentication]
      parameters:
        - { $ref: "#/components/parameters/CeremonyID" }
        - { $ref: "#/components/parameters/Origin" }
        - { $ref: "#/components/parameters/CSRFToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebAuthnCredential" }
      responses:
        "200": { $ref: "#/components/responses/OK" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/security/passkeys:
    get:
      operationId: listPasskeys
      tags: [Security]
      responses:
        "200": { $ref: "#/components/responses/OK" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/security/passkeys/options:
    post:
      operationId: beginAdditionalPasskey
      tags: [Security]
      parameters:
        - { $ref: "#/components/parameters/Origin" }
        - { $ref: "#/components/parameters/CSRFToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasskeyNameRequest" }
      responses:
        "200": { $ref: "#/components/responses/OK" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/security/passkeys/finish:
    post:
      operationId: finishAdditionalPasskey
      tags: [Security]
      parameters:
        - { $ref: "#/components/parameters/CeremonyID" }
        - { $ref: "#/components/parameters/Origin" }
        - { $ref: "#/components/parameters/CSRFToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebAuthnCredential" }
      responses:
        "201": { $ref: "#/components/responses/Created" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/security/passkeys/{credentialID}:
    delete:
      operationId: deletePasskey
      tags: [Security]
      parameters:
        - { $ref: "#/components/parameters/CredentialID" }
        - { $ref: "#/components/parameters/Origin" }
        - { $ref: "#/components/parameters/CSRFToken" }
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/admin/users:
    get:
      operationId: listAdminUsers
      tags: [Administration]
      responses:
        "200": { $ref: "#/components/responses/OK" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/admin/users/{userID}:
    patch:
      operationId: updateAdminUser
      tags: [Administration]
      parameters:
        - { $ref: "#/components/parameters/UserID" }
        - { $ref: "#/components/parameters/Origin" }
        - { $ref: "#/components/parameters/CSRFToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserUpdateRequest" }
      responses:
        "200": { $ref: "#/components/responses/OK" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/admin/invitations:
    post:
      operationId: createUserInvitation
      tags: [Administration]
      parameters:
        - { $ref: "#/components/parameters/Origin" }
        - { $ref: "#/components/parameters/CSRFToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvitationRequest" }
      responses:
        "201": { $ref: "#/components/responses/Created" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/admin/invitations/{invitationID}:
    delete:
      operationId: revokeUserInvitation
      tags: [Administration]
      parameters:
        - { $ref: "#/components/parameters/InvitationID" }
        - { $ref: "#/components/parameters/Origin" }
        - { $ref: "#/components/parameters/CSRFToken" }
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/admin/users/{userID}/recovery-invitations:
    post:
      operationId: createRecoveryInvitation
      tags: [Administration]
      parameters:
        - { $ref: "#/components/parameters/UserID" }
        - { $ref: "#/components/parameters/Origin" }
        - { $ref: "#/components/parameters/CSRFToken" }
      responses:
        "201": { $ref: "#/components/responses/Created" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/admin/audit:
    get:
      operationId: listAudit
      tags: [Administration]
      responses:
        "200": { $ref: "#/components/responses/OK" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/apps:
    get:
      operationId: listAdminApps
      tags: [Offers]
      responses:
        "200": { $ref: "#/components/responses/OK" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/apps/{appID}/offers:
    get:
      operationId: listOffers
      tags: [Offers]
      parameters:
        - { $ref: "#/components/parameters/AppID" }
      responses:
        "200": { $ref: "#/components/responses/OK" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createOffer
      tags: [Offers]
      parameters:
        - { $ref: "#/components/parameters/AppID" }
        - { $ref: "#/components/parameters/Origin" }
        - { $ref: "#/components/parameters/CSRFToken" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOfferRequest" }
      responses:
        "201": { $ref: "#/components/responses/Created" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/apps/{appID}/metrics/offers:
    get:
      operationId: getOfferMetrics
      tags: [Offers]
      parameters:
        - { $ref: "#/components/parameters/AppID" }
      responses:
        "200": { $ref: "#/components/responses/OK" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/apps/{appID}/offers/preview:
    post:
      operationId: previewOffer
      tags: [Offers]
      parameters:
        - { $ref: "#/components/parameters/AppID" }
        - { $ref: "#/components/parameters/Origin" }
        - { $ref: "#/components/parameters/CSRFToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OfferDraft" }
      responses:
        "200": { $ref: "#/components/responses/OK" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/apps/{appID}/offers/{offerID}/deactivate:
    post:
      operationId: deactivateOffer
      tags: [Offers]
      parameters:
        - { $ref: "#/components/parameters/AppID" }
        - { $ref: "#/components/parameters/OfferID" }
        - { $ref: "#/components/parameters/Origin" }
        - { $ref: "#/components/parameters/CSRFToken" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200": { $ref: "#/components/responses/OK" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/apps/{appID}/offers/{offerID}/custom-codes:
    post:
      operationId: createCustomCode
      tags: [Offers]
      parameters:
        - { $ref: "#/components/parameters/AppID" }
        - { $ref: "#/components/parameters/OfferID" }
        - { $ref: "#/components/parameters/Origin" }
        - { $ref: "#/components/parameters/CSRFToken" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomCodeRequest" }
      responses:
        "201": { $ref: "#/components/responses/Created" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/apps/{appID}/offers/{offerID}/one-time-code-batches:
    post:
      operationId: createOneTimeCodeBatch
      tags: [Offers]
      parameters:
        - { $ref: "#/components/parameters/AppID" }
        - { $ref: "#/components/parameters/OfferID" }
        - { $ref: "#/components/parameters/Origin" }
        - { $ref: "#/components/parameters/CSRFToken" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OneTimeCodeBatchRequest" }
      responses:
        "201": { $ref: "#/components/responses/Created" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/apps/{appID}/offers/{offerID}/code-pools:
    get:
      operationId: listCodePools
      tags: [Offers]
      parameters:
        - { $ref: "#/components/parameters/AppID" }
        - { $ref: "#/components/parameters/OfferID" }
      responses:
        "200": { $ref: "#/components/responses/OK" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/apps/{appID}/one-time-code-batches/{batchID}/download:
    post:
      operationId: downloadOneTimeCodes
      tags: [Offers]
      parameters:
        - { $ref: "#/components/parameters/AppID" }
        - { $ref: "#/components/parameters/BatchID" }
        - { $ref: "#/components/parameters/Origin" }
        - { $ref: "#/components/parameters/CSRFToken" }
      responses:
        "200":
          description: One-time offer codes as CSV.
          content:
            text/csv:
              schema:
                type: string
        default: { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    AdminSession:
      type: apiKey
      in: cookie
      name: __Host-tellyouwhat_admin_session
  parameters:
    AppID:
      name: appID
      in: path
      required: true
      schema: { type: string, pattern: "^[A-Za-z0-9._:-]{1,128}$" }
    OfferID:
      name: offerID
      in: path
      required: true
      schema: { type: string, pattern: "^[A-Za-z0-9._:-]{1,128}$" }
    BatchID:
      name: batchID
      in: path
      required: true
      schema: { type: string, pattern: "^[A-Za-z0-9._:-]{1,128}$" }
    CredentialID:
      name: credentialID
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 2048 }
    UserID:
      name: userID
      in: path
      required: true
      schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,128}$" }
    InvitationID:
      name: invitationID
      in: path
      required: true
      schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,128}$" }
    CeremonyID:
      name: X-Admin-Ceremony-ID
      in: header
